// 一筆紀錄展開成 1 或 2 組藍圖（閏月＝兩組）
function pairBlueprints(r){
  const lunar=solarToLunar(r.year,r.month,r.day);
  if(!lunar) return [];
  const bps=[{gy:r.year,gm:r.month,gd:r.day,ly:lunar.year,lm:lunar.month,ld:lunar.day,isLeap:lunar.isLeap,sup:'',h:r.hour,mn:r.minute}];
  if(lunar.isLeap){
    bps[0].sup='¹';
    const s2=lunarToSolar(lunar.year,lunar.month,lunar.day);
    if(s2){
      const lm2=lunar.month===12?1:lunar.month+1;
      const ly2=lunar.month===12?lunar.year+1:lunar.year;
      bps.push({gy:s2.year,gm:s2.month,gd:s2.day,ly:ly2,lm:lm2,ld:lunar.day,isLeap:false,sup:'²',h:r.hour,mn:r.minute});
    }
  }
  // 手動第二組生日（報錯戶口等情況）：紀錄裡有存的話，視為第三種可能生日一併交叉組合
  // 時分獨立帶入（可能跟主生日不同），閏月則佔用 sup=1/2，第二組生日永遠排在最後一個 sup
  if(r.year2){
    const lunar2=solarToLunar(r.year2,r.month2,r.day2);
    if(lunar2){
      if(bps.length===1) bps[0].sup='¹';
      const sup=bps.length===1?'²':'³';
      bps.push({gy:r.year2,gm:r.month2,gd:r.day2,ly:lunar2.year,lm:lunar2.month,ld:lunar2.day,isLeap:lunar2.isLeap,sup,h:r.hour2,mn:r.minute2});
    }
  }
  return bps;
}

// 藍圖 → 各階段國曆／農曆主命數
function pairStageMap(bp,h,mn){
  const hh=(h===undefined)?null:h, mm=(mn===undefined)?null:mn;
  const g=calcStages(bp.gy,bp.gm,bp.gd,hh,mm).stages;
  const l=calcStages(bp.ly,bp.lm,bp.ld,hh,mm).stages;
  const map={};
  ['幼年','少年','青年','中年','老年'].forEach(n=>{
    const gs=g.find(x=>x.name===n),ls=l.find(x=>x.name===n);
    if(gs&&ls) map[n]={g:gs.destiny,l:ls.destiny};
  });
  return map;
}

// 關係數收斂：≤12 直接顯示，>12 收斂一次到個位數
function relNum(v){return v>12?sumArr(digs(v)):v;}

// 方括號矩陣：a=左+ b=右+ c=左− d=右−
function relNumMatrix(a,b,c,d,label,sub){
  const meta=(label?`<div class="relnum-label">${label}</div>`:'')+(sub?`<div class="relnum-sub">${sub}</div>`:'');
  return `<div class="relnum-matrix"><div class="relnum">${relNum(a+b)}</div>`+
  `<div class="relnum-mid"><span class="relnum">${relNum(a+d)}</span><span class="relnum-bracket"><span class="relnum-bkt">[</span><span class="relnum-inner"><span>${a}</span><span>${b}</span><span>${c}</span><span>${d}</span></span><span class="relnum-bkt">]</span></span><span class="relnum">${relNum(c+b)}</span></div>`+
  `<div class="relnum">${relNum(c+d)}</div>`+meta+`</div>`;
}
function relNumBlank(){
  return `<div class="relnum-matrix relnum-blank"><div class="relnum">0</div><div class="relnum-mid"><span class="relnum">0</span><span class="relnum-bracket"><span class="relnum-bkt">[</span><span class="relnum-inner"><span>0</span><span>0</span><span>0</span><span>0</span></span><span class="relnum-bkt">]</span></span><span class="relnum">0</span></div><div class="relnum">0</div></div>`;
}

// 緣：九組矩陣（上五下四，編號＝解讀順位 97135／8624）
const BOND_ROW1=[['老年','老年',9],['中年','中年',7],['青年','青年',1],['少年','少年',3],['幼年','幼年',5]];
const BOND_ROW2=[['老年','中年',8],['中年','青年',6],['青年','少年',2],['少年','幼年',4]];
function renderBondSet(mapL,mapR){
  const mk=pairs=>'<div class="bond-row">'+pairs.map(([a,b,ord])=>{
    const L=mapL[a],R=mapR[b];
    if(!L||!R) return relNumBlank();
    return relNumMatrix(L.g,R.g,L.l,R.l,'',ord);
  }).join('')+'</div>';
  return mk(BOND_ROW1)+mk(BOND_ROW2);
}

// 份：以兩人國曆生日為節點，從 startYear 起算固定三年（六段）；
// 節點年份範圍多抓一年只為取得封口生日，不影響段數固定為 6
function rhythmSegments(bpL,bpR,startYear){
  const nodes=[];
  for(let y=startYear;y<=startYear+3;y++){
    nodes.push({y,m:bpL.gm,d:bpL.gd,who:'L'});
    nodes.push({y,m:bpR.gm,d:bpR.gd,who:'R'});
  }
  nodes.sort((a,b)=>(a.y-b.y)||(a.m-b.m)||(a.d-b.d));
  const merged=[];
  nodes.forEach(n=>{
    const last=merged[merged.length-1];
    if(last&&last.y===n.y&&last.m===n.m&&last.d===n.d) last.who='LR';
    else merged.push({y:n.y,m:n.m,d:n.d,who:n.who});
  });
  const segs=[];
  for(let i=0;i<merged.length-1&&segs.length<6;i++) segs.push({start:merged[i],end:merged[i+1]});
  return segs;
}
// 節點當下的國曆／農曆流年：切換點統一以國曆生日為準，
// 國曆農曆共用同一個年份數字 FY，不再借用 calcFlowData 的農曆真實換算邏輯
function rhythmFlowAt(bp,y,m,d){
  const gBdPassed=(m>bp.gm)||(m===bp.gm&&d>=bp.gd);
  const FY=gBdPassed?y:y-1;
  const gF=makeStage(sumArr([...digs(FY),...digs(bp.gm),...digs(bp.gd)]));
  const lF=makeStage(sumArr([...digs(FY),...digs(bp.lm),...digs(bp.ld)]));
  return{gF,lF};
}
function renderRhythmSet(bpL,bpR,nameL,nameR,startYear){
  const segs=rhythmSegments(bpL,bpR,startYear);
  if(!segs.length) return '';
  // 起點（去年較早生日者）固定在上，另一人固定在下；若首節點恰好同日，預設左側（年長者）在上
  const topWho=segs[0].start.who==='R'?'R':'L';
  // position: 'top'＝日期在外、流年貼近矩陣；'bottom'＝流年貼近矩陣、日期在外（上下鏡射）
  function rhythmLabel(dateStr,name,gStr,lStr,position){
    const dateDiv=`<div class="rhythm-date">${dateStr}</div>`;
    const nameDiv=`<div class="rhythm-name">${escapeHtmlRec(name)}</div>`;
    const flowDiv=`<div class="rhythm-flow">+${gStr} −${lStr}</div>`;
    return position==='top'?(dateDiv+nameDiv+flowDiv):(flowDiv+nameDiv+dateDiv);
  }
  return '<div class="rhythm-strip">'+segs.map(s=>{
    const fL=rhythmFlowAt(bpL,s.start.y,s.start.m,s.start.d);
    const fR=rhythmFlowAt(bpR,s.start.y,s.start.m,s.start.d);
    const dateStr=`${s.start.y}/${p2(s.start.m)}/${p2(s.start.d)}`;
    const who=s.start.who;
    const showL=(who==='L'||who==='LR'), showR=(who==='R'||who==='LR');
    const lLabel=pos=>rhythmLabel(dateStr,nameL,fL.gF.str,fL.lF.str,pos);
    const rLabel=pos=>rhythmLabel(dateStr,nameR,fR.gF.str,fR.lF.str,pos);
    const topLabel=topWho==='L'?(showL?lLabel('top'):''):(showR?rLabel('top'):'');
    const bottomLabel=topWho==='L'?(showR?rLabel('bottom'):''):(showL?lLabel('bottom'):'');
    return `<div class="rhythm-seg">
      <div class="rhythm-slot rhythm-slot-top">${topLabel}</div>
      ${relNumMatrix(fL.gF.destiny,fR.gF.destiny,fL.lF.destiny,fR.lF.destiny,'','')}
      <div class="rhythm-slot rhythm-slot-bottom">${bottomLabel}</div>
    </div>`;
  }).join('')+'</div>';
}

// 合盤面板用：單一日期的「五大階段數」精簡區塊（生日 header ＋ 階段數 row）
// 重用「五大階段數」分頁最上面那段的呈現方式（同一套 cal-title/num-header/num-row/num-cell/stage-val class），
// 但不含波動表與 99 歲流年表——那些跟合盤資訊無關，只會讓面板過長。renderFlowYearTable() 本身不受影響。
function buildPairStageBlock(y,m,d,h,mn,isGreg,isLeap){
  const{innate,stages}=calcStages(y,m,d,h,mn);
  const calTitle=`<div class="cal-title">${isGreg?t('greg'):t('lun')}<span class="cal-sign">${isGreg?'(+)':'(-)'}</span></div>`;
  const ftCols=(h!==null)?(mn!==null?5:4):3;
  const bdParts=[y,(isLeap?`<span class="leap-badge">${t('leap')}</span>`:'')+p2(m),p2(d)];
  if(h!==null) bdParts.push(p2(h));
  if(mn!==null) bdParts.push(p2(mn));
  const bdCells=bdParts.map(v=>`<div class="num-cell label">${v}</div>`).join('');
  const bdHeader=`<div class="num-header" style="grid-template-columns:repeat(${ftCols},minmax(0,1fr))">${bdCells}</div>`;
  const stageOrder=['老年','中年','青年','少年','幼年'].slice(0,ftCols);
  const stageCells=stageOrder.map(name=>{
    const s=stages.find(x=>x.name===name);
    if(!s) return`<div class="num-cell"></div>`;
    const lv=calcLevel(innate,s.destiny,s.pathNums);
    const isd=name==='青年';
    const parts=s.str.split('/');
    const fmt=parts.map((pt,i)=>i===parts.length-1?`<span class="stage-dest">${pt}</span>`:`<span class="stage-path">${pt}/</span>`).join('');
    return`<div class="num-cell"><div class="stage-val">
      <span class="stage-num${isd?' destiny':''}">${fmt}</span>
      <span class="stage-lv">${lv.level}</span>
    </div></div>`;
  }).join('');
  const stagesRow=`<div class="num-row" style="grid-template-columns:repeat(${ftCols},minmax(0,1fr))">${stageCells}</div>`;
  return calTitle+bdHeader+stagesRow;
}

function pairPersonLine(r,bps){
  return bps.map(bp=>{
    const h=(bp.h!==null&&bp.h!==undefined)?bp.h:null;
    const mn=(bp.mn!==null&&bp.mn!==undefined)?bp.mn:null;
    const nameDiv=`<div class="pp-name">${escapeHtmlRec(r.name)}${bp.sup}</div>`;
    const gregBlock=buildPairStageBlock(bp.gy,bp.gm,bp.gd,h,mn,true,false);
    const lunBlock=buildPairStageBlock(bp.ly,bp.lm,bp.ld,h,mn,false,bp.isLeap);
    return `<div class="pp-block">${nameDiv}${gregBlock}${lunBlock}</div>`;
  }).join('');
}

function openPairPanel(){
  const list=getRecords();
  const sel=_pairSel.map(id=>list.find(r=>r.id===id)).filter(Boolean);
  if(sel.length!==2) return;
  if(typeof gtag==='function') gtag('event','pair_panel_open');
  sel.sort((a,b)=>(a.year-b.year)||(a.month-b.month)||(a.day-b.day)); // 年長者在左
  _pairLastIds=[sel[0].id,sel[1].id];
  _rhythmStartYear=null; // 每次重新開啟合盤面板，份的年份區間重置回今年
  renderPairPanel(sel[0],sel[1]);
  document.getElementById('pairOverlay').classList.add('open');
}
function closePairPanel(){
  document.getElementById('pairOverlay').classList.remove('open');
}
function renderPairPanel(L,R){
  document.getElementById('pairPanelTitle').textContent=t('pairPanelTitle');
  const bpsL=pairBlueprints(L),bpsR=pairBlueprints(R);
  if(!bpsL.length||!bpsR.length){
    document.getElementById('pairCapture').innerHTML=`<div class="error">${t('errLunar')}</div>`;
    return;
  }

function soulCalcAdjYear(country,by,bm,bd,custom){

// 主體/副體比對：調整年每一位數字依序（由左到右）在西元年數字裡找第一個「還沒被配對過」的相同數字，
// 配對成功就消耗掉那個位置歸主體；配對不到的調整年數字、以及年份裡剩下沒配對到的數字，全部歸副體。
// 不是單純集合去重比對——同一個數字出現兩次以上時，次數要逐一扣抵，這條規則已用
// 1985/209、1989/213、2012/102 三組案例驗證過。
function soulBodyCalc(by,adjYear,bm,bd){
  const yearDigits=digs(by), adjDigits=digs(adjYear);
  const usedYearIdx=new Set();
  const matchedDigits=[], unmatchedAdjDigits=[];
  for(const d of adjDigits){
    let foundIdx=-1;
    for(let i=0;i<yearDigits.length;i++){
      if(!usedYearIdx.has(i)&&yearDigits[i]===d){ foundIdx=i; break; }
    }
    if(foundIdx!==-1){ usedYearIdx.add(foundIdx); matchedDigits.push(d); }
    else{ unmatchedAdjDigits.push(d); }
  }
  const unmatchedYearDigits=yearDigits.filter((_,i)=>!usedYearIdx.has(i));
  const bodyNum=matchedDigits.join('')+p2(bm)+p2(bd);
  const fuNum=unmatchedYearDigits.concat(unmatchedAdjDigits).join('')||'0';
  return {bodyNum,fuNum};
}

// 依足歲判斷目前所在的人生階段（幼0-10／少11-20／青21-40／中41-60／老61+）。
// isGreg=true 用陽曆生日比對陽曆今日；isGreg=false 用農曆生日比對換算成農曆的今日，
// 邏輯跟 renderFlowYearTable 裡九年能量波動表判斷 currentYear 的方式一致。
function soulCurrentStageName(birthY,birthM,birthD,isGreg){
  const today=new Date();
  const todayY=today.getFullYear(),todayM=today.getMonth()+1,todayD=today.getDate();
  let currentYear;
  if(isGreg){
    const passed=(todayM>birthM)||(todayM===birthM&&todayD>=birthD);
    currentYear=passed?todayY:todayY-1;
  } else {
    const lt=solarToLunar(todayY,todayM,todayD);
    const ltY=lt?lt.year:todayY,ltM=lt?lt.month:todayM,ltD=lt?lt.day:todayD;
    const passed=(ltM>birthM)||(ltM===birthM&&ltD>=birthD);
    currentYear=passed?ltY:ltY-1;
  }
  const age=currentYear-birthY+1;
  if(age<=10) return '幼年';
  if(age<=20) return '少年';
  if(age<=40) return '青年';
  if(age<=60) return '中年';
  return '老年';
}
function soulStageCells(leftIdx,rightIdx,stages,currentStageName){

  order.map(n=>stages.find(s=>s.name===n)).filter(Boolean).forEach(st=>{
    const idx=order.indexOf(st.name);
    const isCurr=st.name===currentStageName;

}

    items+=`<div class="soul-tl-yangcell soul-tl-overflow${yangCurr[k]?' soul-tl-stage-current':''}" style="grid-column:${col}/span 2;grid-row:1/span 2">
      <div class="soul-tl-stagelabel">${yangL[k]||'&nbsp;'}</div>
      <div class="soul-tl-yang">${yangC[k]}</div>
    </div>`;
  });

  // 副體／主體：各自兩列(回頭折線+主線)，每個刻度各自一個 div，跟揚升計畫共用同一套 grid 欄位定義
  function laneRow(arr,rowLine,colorClass){
    let h='';
    for(let k=0;k<SOUL_TOTAL_LEN;k++){
      if(k===SOUL_NOW_IDX) continue;
      const i=visIndex(k);
        h+=`<div class="soul-tl-cell ${colorClass}" style="grid-column:${tickCol(i)}/span 2;grid-row:${rowLine}">${arr[k]||'&nbsp;'}</div>`;
    }
    return h;
  }
  items+=laneRow(fuRows.fold,3,'soul-tl-fu');
  items+=laneRow(fuRows.main,4,'soul-tl-fu');
  items+=laneRow(bodyRows.fold,5,'soul-tl-body');
  items+=laneRow(bodyRows.main,6,'soul-tl-body');

  // 座標軸：17格(含NOW)，起點比內容列少1欄，形成半格位移，讓兩端刻度跟內容列對齊
  SOUL_POS_LABELS_FULL.forEach((l,j)=>{
    const isNow=l==='NOW';
    items+=`<div class="soul-tl-cell soul-tl-axis${isNow?' soul-tl-nowcell':''}" style="grid-column:${2+j*2}/span 2;grid-row:7">${l}</div>`;
  });

  return `<div class="soul-tl-grid">${items}</div>`;
}

// 單一生日組（陽曆 by/bm/bd/bh/bmn）算出陽曆軌＋農曆軌兩段完整 HTML，country/custom 共用同一組對照國家
function renderSoulResultForBirthday(country,custom,by,bm,bd,bh,bmn){
  const missingTime=(bh===null||bmn===null);
  const adjResult=soulCalcAdjYear(country,by,bm,bd,custom);
  if(adjResult.adjYear===null){
    return `<div style="color:#c0392b;font-size:12px;margin-top:8px">${adjResult.note}</div>`;
  }
  const {bodyNum,fuNum}=soulBodyCalc(by,adjResult.adjYear,bm,bd);
  const bodyInfo=soulBodyTitle(bodyNum);
  const fuInfo=soulFuTitle(fuNum,bodyInfo.c0,bodyInfo.c9);
  const {stages}=calcStages(by,bm,bd,bh,bmn);

  const refLabel=country==='JP'?t('soulEraLabel').replace('{name}',adjResult.refDate.name):t('soulFoundingLabel');
  const refDateStr=`+${adjResult.refDate.y}/${p2(adjResult.refDate.m)}/${p2(adjResult.refDate.d)}`;
  const soulYearStr=`+${adjResult.adjYear}/${p2(bm)}/${p2(bd)}`;

  let html='';
  if(missingTime){
    html+=`<div style="color:#c0392b;font-size:11px;margin-bottom:6px">${t('soulMissingTimeNote')}</div>`;
  }
  html+=renderSoulTrackBlock({
    refLabel,refDateStr,yearLabel:t('soulSkyNumLabel'),yearStr:soulYearStr,
    bodyNum,fuNum,bodyInfo,fuInfo,stages,
    stageBirthY:by,stageBirthM:bm,stageBirthD:bd,isGreg:true
  });

  const lunarBd=solarToLunar(by,bm,bd);
  const lunarFound=solarToLunar(adjResult.refDate.y,adjResult.refDate.m,adjResult.refDate.d);
  if(lunarBd&&lunarFound){
    let lunAdj=lunarBd.year-lunarFound.year;
    if(!(lunarBd.month<lunarFound.month||(lunarBd.month===lunarFound.month&&lunarBd.day<lunarFound.day))) lunAdj+=1;
    const lunFoundStr=`-${lunarFound.year}/${p2(lunarFound.month)}/${p2(lunarFound.day)}`;
    const lunYearStr=`-${lunAdj}/${p2(lunarBd.month)}/${p2(lunarBd.day)}`;

    const {bodyNum:lBodyNum,fuNum:lFuNum}=soulBodyCalc(lunarBd.year,lunAdj,lunarBd.month,lunarBd.day);
    const lBodyInfo=soulBodyTitle(lBodyNum);
    const lFuInfo=soulFuTitle(lFuNum,lBodyInfo.c0,lBodyInfo.c9);
    const {stages:lStagesArr}=calcStages(lunarBd.year,lunarBd.month,lunarBd.day,bh,bmn);

    html+=renderSoulTrackBlock({
      refLabel,refDateStr:lunFoundStr,yearLabel:t('soulEarthNumLabel'),yearStr:lunYearStr,
      bodyNum:lBodyNum,fuNum:lFuNum,bodyInfo:lBodyInfo,fuInfo:lFuInfo,stages:lStagesArr,
      stageBirthY:lunarBd.year,stageBirthM:lunarBd.month,stageBirthD:lunarBd.day,isGreg:false
    });
  }
  return `<div class="soul-result">${html}</div>`;
}

// 對照國家共用同一組；依 _soulSets（1~3組：主生日／閏月第二組／報錯戶口第三組）依序輸出，組間比照份/緣同款分隔線
function renderSoulSection(){
  const country=document.getElementById('soulCountry').value;
  const outEl=document.getElementById('soulOutput');
  if(!country){ outEl.innerHTML=''; return; }
  if(!_soulSets.length){ outEl.innerHTML=''; return; }
  if(country==='CUSTOM'&&!_soulCustomData){
    document.getElementById('soulCustomModal').classList.remove('hidden');
    return;
  }
  const custom=country==='CUSTOM'?_soulCustomData:null;

  let html='';
  _soulSets.forEach(set=>{
    if(set.dividerKey){
      html+=`<div style="border-top:1px dashed #ddd;margin-top:16px;padding-top:8px;text-align:center;font-size:11px;color:#bbb;letter-spacing:.1em">${t(set.dividerKey)}</div>`;
    }
    html+=renderSoulResultForBirthday(country,custom,set.by,set.bm,set.bd,set.bh,set.bmn);
  });
  outEl.innerHTML=html;
}

// 國曆軌／農曆軌共用的完整區塊渲染：標題＋主體／副體＋揚升計畫文字版＋表格版時間軸
function renderSoulTrackBlock({refLabel,refDateStr,yearLabel,yearStr,bodyNum,fuNum,bodyInfo,fuInfo,stages,stageBirthY,stageBirthM,stageBirthD,isGreg}){
  const currentStageName=soulCurrentStageName(stageBirthY,stageBirthM,stageBirthD,isGreg);
  const order=['幼年','少年','青年','中年','老年']; // 內部比對用固定中文key，跟語言無關
  const abbr=t('soulStageAbbr');
  const yangLine=order.map((n,idx)=>{
    const st=stages.find(s=>s.name===n);
    if(!st) return `${abbr[idx]}：－`;
    const marks=[];
    for(let k=0;k<soulCountChar(st.checkStr,'9');k++) marks.push('9');
    for(let k=0;k<soulCountChar(st.checkStr,'0');k++) marks.push('0');
    return `${abbr[idx]}：${marks.length?marks.join('、'):'X'}`;
  }).join('｜');

  let html='<div class="soul-track">';
  html+=`<div class="soul-numline" style="color:#999"><span class="lab">${refLabel}</span><span class="num">${refDateStr}</span><span class="title" style="margin-left:14px;color:#999">${yearLabel}：</span><span class="num" style="color:#999">${yearStr}</span></div>`;
  html+=`<div class="soul-numline"><span class="lab">${t('soulBodyLabel')}</span><span class="num soul-body-num">【${bodyNum}】</span><span class="title">${bodyInfo.title}</span></div>`;
  html+=`<div class="soul-numline"><span class="lab">${t('soulFuLabel')}</span><span class="num soul-fu-num">【${fuNum}】</span><span class="title">${fuInfo.title}</span></div>`;
  if(bodyInfo.exceeded||fuInfo.exceeded){
    html+=`<div style="font-size:10px;color:#bbb;margin-top:-2px">⁺ ${t('soulExceedNote')}</div>`;
  }
  html+=`<div class="soul-yang-line">${t('soulYangPlanLabel')}｜${yangLine}｜</div>`;
  html+=`<div class="soulChartWrap">${renderSoulChart(bodyInfo,fuInfo,stages,currentStageName)}</div>`;
  html+='</div>';
  return html;
}

function onSoulCountryChange(sel){
  if(sel.value==='CUSTOM'){
    document.getElementById('soulCustomModal').classList.remove('hidden');
    if(_soulCustomData){
      document.getElementById('soulCName').value=_soulCustomData.name||'';
      document.getElementById('soulCY').value=_soulCustomData.y;
      document.getElementById('soulCM').value=_soulCustomData.m;
      document.getElementById('soulCD').value=_soulCustomData.d;
    }
  } else {
    _soulPrevCountry=sel.value;
    document.getElementById('soulCustomLabel').classList.add('hidden');
    document.getElementById('soulCustomLabel').textContent='';
    renderSoulSection();
  }
}
function cancelSoulCustom(){
  document.getElementById('soulCustomModal').classList.add('hidden');
  if(!_soulCustomData) document.getElementById('soulCountry').value=_soulPrevCountry;
}
function renderSoulCustomLabel(){
  if(!_soulCustomData) return;
  const {name,y,m,d}=_soulCustomData;
  const dateStr=`${y}/${p2(m)}/${p2(d)}`;
  const namePrefix=name?(lang==='en'?name+': ':name+'：'):'';
  document.getElementById('soulCustomLabel').textContent=namePrefix+t('soulCustomSetLabel').replace('{date}',dateStr);
}
function confirmSoulCustom(){
  const y=+document.getElementById('soulCY').value, m=+document.getElementById('soulCM').value, d=+document.getElementById('soulCD').value;
  if(!y||!m||!d){ alert(t('soulCustomAlertIncomplete')); return; }
  const name=document.getElementById('soulCName').value.trim();
  _soulCustomData={name,y,m,d};
  _soulPrevCountry='CUSTOM';
  document.getElementById('soulCustomModal').classList.add('hidden');
  document.getElementById('soulCustomLabel').classList.remove('hidden');
  renderSoulCustomLabel();
  renderSoulSection();
}

function openSoulRefModal(){
  const alienData=lang==='en'?SOUL_ALIEN_REF_EN:SOUL_ALIEN_REF;
  const earthData=lang==='en'?SOUL_EARTH_REF_EN:SOUL_EARTH_REF;
  const dimData=lang==='en'?SOUL_DIMENSION_REF_EN:SOUL_DIMENSION_REF;
  const alienList=document.getElementById('soulRefAlienTable');
  alienList.innerHTML=alienData.map(r=>
    `<div style="padding:6px 0;border-bottom:1px solid #eee">
      <div>${lang==='en'?`${r.n}×0 — <strong>${r.title}</strong>`:`${r.n}顆0：<strong>${r.title}</strong>`}</div>
      ${r.note?`<div style="color:#666;font-size:11px;margin-top:2px">${r.note}</div>`:''}
    </div>`
  ).join('');
  const earthList=document.getElementById('soulRefEarthTable');
  earthList.innerHTML=earthData.map(r=>
    `<div style="padding:6px 0;border-bottom:1px solid #eee">
      <div>${lang==='en'?`${r.n}×9 — <strong>${r.title}</strong>`:`${r.n}顆9：<strong>${r.title}</strong>`}</div>
      ${r.note?`<div style="color:#666;font-size:11px;margin-top:2px">${r.note}</div>`:''}
    </div>`
  ).join('');
  const dimColWidth=lang==='en'?'':'width:7.2em;';
  const dimTbody=document.getElementById('soulRefDimTable');
  dimTbody.innerHTML=dimData.map(r=>
    `<tr style="border-bottom:1px solid #eee"><td colspan="2" style="padding:5px 4px;font-weight:600;white-space:nowrap;${dimColWidth}text-align:center;vertical-align:top">${r.title}</td><td style="padding:5px 4px;color:#666;font-size:11px">${r.desc}</td></tr>`
  ).join('');
  document.getElementById('soulRefModal').classList.remove('hidden');
}
function closeSoulRefModal(){
  document.getElementById('soulRefModal').classList.add('hidden');
}
