<!DOCTYPE html>
<html lang="zh-TW">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
<meta name="apple-mobile-web-app-title" content="彩虹數字計算器">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>彩虹數字計算器</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500&family=MPLUS+1+Code:wght@300;400;500&display=swap" rel="stylesheet">
<script>
// 平台判斷共用函式（App化用），定義在 head 最前面，因為 lunar.js／html2canvas
// 要在頁面解析初期就決定讀本機還是CDN，比其他程式碼都早執行。
window.isNativeApp = function(){
  return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
};
window.__isNative = window.isNativeApp(); // 只判斷一次，結果快取起來，避免重複呼叫
document.write('<script src="' + (window.__isNative ? 'lib/lunar.js' : 'https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js') + '"><\/script>');
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f5;color:#1a1a1a;font-family:'M PLUS Rounded 1c',sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 calc(60px + env(safe-area-inset-bottom,0px))}
.page{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.header{padding:32px 24px 20px;text-align:center;position:relative}
.lang-btn{position:absolute;top:32px;right:20px;font-size:12px;color:#999;border:1px solid #ddd;border-radius:14px;padding:4px 14px;min-width:44px;text-align:center;cursor:pointer;background:#fff;font-family:'M PLUS Rounded 1c',sans-serif;letter-spacing:.05em;transition:all .15s}
.lang-btn:hover{color:#555;border-color:#bbb}
.input-area{padding:0 20px 20px}
.input-note{font-size:13px;color:#777;margin-bottom:16px;line-height:1.6;text-align:center}
.input-row{display:flex;gap:10px;margin-bottom:10px;width:100%}
.input-group{display:flex;flex-direction:column;gap:4px;min-width:0}
.input-group label{font-size:11px;color:#999;letter-spacing:.05em;text-align:center;display:block}
.input-group input{border:1px solid #ddd;border-radius:6px;padding:10px 4px;font-size:16px;font-family:'MPLUS1Code',monospace;color:#1a1a1a;outline:none;background:#fff;width:100%;text-align:center}
.input-group input:focus{border-color:#666}
.input-group input.invalid{border-color:#e74c3c;background:#fff5f5}
.input-group input::placeholder{color:#ccc}
.input-group.date,.input-group.time{flex:1}
.tabs{display:flex;border-bottom:1px solid #e8e8e8}
.tab{flex:1;padding:12px 4px;font-size:13px;letter-spacing:.05em;text-align:center;color:#999;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:pre-line;line-height:1.4}
.tab-l1{position:relative;display:inline-block}
.tab-sup{position:absolute;left:100%;top:0;white-space:nowrap;margin-left:1px}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a;font-weight:500}
.results{padding:0 20px}
.cal-section{margin-top:24px;padding-top:8px}
.cal-section+.cal-section{margin-top:16px}
.cal-title{font-size:14px;font-weight:500;color:#1a1a1a;margin-bottom:12px;text-align:center}
.cal-label{font-family:'MPLUS1Code',monospace;font-weight:500;font-size:13px}
.cal-sign{font-family:'MPLUS1Code',monospace;letter-spacing:0}
.num-header{display:grid;gap:0;border-bottom:2px solid #1a1a1a;padding-bottom:8px;margin-bottom:10px;justify-items:center}
.num-row{display:grid;gap:0;align-items:center;justify-items:center}
.num-cell{text-align:center;padding:4px 2px}
.num-cell.label{font-size:15px;font-weight:500;color:#1a1a1a;font-family:'MPLUS1Code',monospace;letter-spacing:0}
.stage-val{display:flex;align-items:baseline;justify-content:center;gap:2px}
.stage-num{font-size:14px;color:#1a1a1a;font-family:'MPLUS1Code',monospace;letter-spacing:0}
.stage-num.destiny{font-size:15px;font-weight:700;font-family:'MPLUS1Code',monospace}
.stage-num.destiny .stage-dest{color:#000;font-weight:700}
.stage-num.destiny .stage-path{color:#555;font-weight:700}
.stage-path{color:#888}
.stage-dest{color:#1a1a1a}
.stage-lv{font-size:11px;color:#4a90d9;font-family:'MPLUS1Code',monospace}
.innate-section{margin-top:32px;border-top:1px solid #e8e8e8;padding-top:20px;text-align:center}
.section-title{font-size:14px;font-weight:500;letter-spacing:.1em;color:#1a1a1a;margin-bottom:12px}
/* 以下為精簡重複 inline style 抽出的共用 class（2026/08新增，純視覺，不影響邏輯）*/
.rec-divider{margin-top:12px;padding-top:12px;border-top:1px dashed #ddd}
.ref-desc-title{font-size:13px;font-weight:700;color:#444;text-align:center;margin-bottom:8px}
.leap-badge{font-size:11px;color:#e06c75;margin-right:1px;vertical-align:middle}
.flow-title-row{display:grid;grid-template-columns:28px 78px 1fr 78px 28px;align-items:center}
.flow-title-top,.flow-value-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px;position:relative}
.flow-title-top .flow-arrow-hidden,.flow-value-row .flow-arrow-hidden{display:none}
.flow-title-top{display:block;text-align:center}
.flow-title-top .flow-title-mid{white-space:nowrap}
.flow-title-top .flow-toggle-btn{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.flow-title-top{margin-bottom:2px}
.flow-range-row{margin-bottom:2px}
/* 區間放在標題左右兩側同一行；窄螢幕時字體隨寬度縮小（最大 10px，跟位格一致），避免撞到標題與 ▼ */
.flow-title-top{height:20px;line-height:20px;margin-bottom:0}
.flow-range-row{margin-top:-20px;height:20px;align-items:center;padding-top:0;margin-bottom:6px;pointer-events:none}
.flow-range-row .flow-range-side{line-height:20px}
.flow-range-row .flow-range-side{font-size:min(10px,calc(((100vw - 40px) / 4 - 17px) / 7.2))}
.flow-title-top .flow-toggle-btn{padding:0 0 0 4px}
.flow-range-side{font-size:10px;line-height:1.35;color:#999;font-family:'MPLUS1Code',monospace;white-space:nowrap;font-weight:400;letter-spacing:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.flow-range-side .r-a{text-align:right}
.flow-range-side .r-b{text-align:left}
.flow-arrow-hidden{background:none;border:none;font-size:10px;padding:0 4px 0 8px;visibility:hidden;justify-self:end}
.flow-toggle-btn{-webkit-appearance:none;appearance:none;background:none;border:none;cursor:pointer;color:#aaa;font-size:10px;font-family:inherit;font-weight:inherit;line-height:inherit;margin:0;padding:0 4px 0 8px;justify-self:end}
.innate-nums{display:flex;gap:0px}
.inn{font-size:14px;color:#bbb;width:18px;text-align:center;font-family:'MPLUS1Code',monospace}
.inn.has{color:#555}
.inn.obs{color:#c0392b;font-weight:500}
.phase-section{margin-top:32px;border-top:1px solid #e8e8e8;padding-top:20px;text-align:center}
#phaseTitleText{margin-bottom:0}
/* 位格兩側用跟九宮格相同的左右對半欄位（1fr 1fr、間距 12px），三角形頂點才會剛好對在九宮格 4／5／6／0 那條中線上 */
.phase-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:0}
.phase-side{width:100%;min-width:0;max-width:190px;justify-self:center}
.phase-svg{width:100%;height:auto;display:block;overflow:visible}
.phase-range{font-size:10px;color:#999;text-align:center;margin-bottom:4px;font-family:'MPLUS1Code',monospace;padding-right:1ch}/* padding-right:1ch 讓區間中間那一槓「-」正好落在中線上 */
.phase-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.phase-nav-row button{background:none;border:1px solid #ddd;border-radius:20px;padding:3px 10px;font-size:11px;color:#666;cursor:pointer;font-family:inherit}
.phase-nav-row button:hover{border-color:#bbb;color:#333}
.phase-pos{font-size:13px;font-weight:700;fill:#999;font-family:'MPLUS1Code',monospace}
.phase-pos.current{fill:#b8860b}
.phase-flow{font-size:10px;font-weight:700;font-family:'MPLUS1Code',monospace}
.phase-edge{stroke:#ddd;stroke-width:1.4;fill:none}
.phase-dot{fill:#999}
.phase-dot.current{fill:#b8860b}
.flow-block{margin-top:16px;border-top:1px solid #e8e8e8;padding-top:20px;text-align:center}
.soul-section{margin-top:32px;border-top:1px solid #e8e8e8;padding-top:20px;padding-bottom:20px;text-align:center}
.soul-country-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:0}
.soul-country-row select{font-size:13px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-family:inherit;background:#fff}
.soul-country-row label{font-size:12px;color:#666}
#soulOutput:not(:empty){margin-top:8px}
.soul-result{margin-top:12px}
.soul-numline{font-size:13px;margin:2px 0}
.soul-numline .lab{color:#888;margin-right:6px}
.soul-numline .num{letter-spacing:.05em;font-family:'MPLUS1Code',monospace}
.soul-numline .title{color:#666;margin-left:8px}
.soul-body-num{color:#1a1a1a}
.soul-fu-num{color:#e06c75}
.soul-yang-line{font-size:12px;color:#488850;margin-top:2px;letter-spacing:.03em}
.soulChartWrap{overflow-x:auto;margin-top:10px}
.soul-track{margin-top:4px}
.soul-track+.soul-track{margin-top:20px;padding-top:16px;border-top:1px dashed #ddd}
/* 36 欄等寬、左右對稱：中間 32 欄給 9x8～0x8，兩側各留 2 欄（9x8 外側／0x8 外側，也是揚升計畫超出一格時畫的位置）。
   兩側用跟刻度格同寬的 1fr，超出的那格才會跟一般格一樣寬、箭頭從刻度線開始 */
.soul-tl-grid{display:grid;grid-template-columns:repeat(36,1fr);font-family:"SF Mono",Menlo,Consolas,monospace}
.soul-tl-grid>div{text-align:center;overflow:hidden;white-space:nowrap;font-size:9px;line-height:1.6;letter-spacing:-.5px}
.soul-tl-yangcell{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:34px;padding:3px 0 1px;width:100%;box-sizing:border-box}
.soul-tl-yangcell>div{line-height:1.2}
.soul-tl-cell.soul-tl-yang,.soul-tl-cell.soul-tl-fu,.soul-tl-cell.soul-tl-body{line-height:.8}
/* 刻度虛線：整片用一張 SVG 畫（從揚升計畫列貫穿到主體列）。不用 CSS dashed 邊框——
   iOS Safari 在欄寬是小數像素時，1px dashed 邊框會斷成點點或整條消失；SVG 的 stroke-dasharray 不受影響 */
.soul-tl-ticks{position:relative;overflow:visible!important}
.soul-tl-ticks svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.soul-tl-nowline{border-left:1px solid #1a1a1a;position:relative;z-index:3}
.soul-tl-nowcell{color:#1a1a1a}
.soul-tl-rowlabel{font-family:inherit;font-size:11px;font-weight:600;color:#888;text-align:center;display:flex;align-items:center;justify-content:center}
.soul-tl-yang{color:#488850}
.soul-tl-fu{color:#e06c75}
.soul-tl-body{color:#1a1a1a}
.soul-tl-stagelabel{color:#488850;font-weight:600;font-size:10px}
.soul-tl-axis{color:#999;font-size:9px;display:flex;align-items:center;justify-content:center}
.soul-tl-yangcell.soul-tl-stage-current{border:none;box-shadow:inset 0 0 0 2px #F0D080;border-radius:3px;background:#FFFDF5;position:relative;z-index:2}
.soul-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:200}
.soul-modal-card{background:#fff;border-radius:12px;padding:20px;width:260px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.soul-modal-card h3{font-size:14px;margin:0 0 12px;text-align:center;font-weight:500}
.soul-modal-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px;font-size:12px}
.soul-modal-row input{width:70px;font-size:13px;padding:5px;border:1px solid #ddd;border-radius:6px}
.soul-modal-btnrow{display:flex;justify-content:center;gap:8px;margin-top:14px}
.soul-modal-card .input-group input{padding:5px 4px;font-size:13px}
.soul-modal-btnrow button{font-size:13px;padding:7px 18px;border:none;border-radius:8px;background:#333;color:#fff;cursor:pointer}
.soul-modal-btnrow button.secondary{background:#eee;color:#333}
.flow-path,.flow-dest{font-size:13px;font-family:'MPLUS1Code',monospace}
.flow-path{color:#999}
.flow-dest{color:#1a1a1a}
.flow-lv{font-size:11px;color:#4a90d9;font-family:'MPLUS1Code',monospace}
.sign{font-size:13px;color:#1a1a1a;margin-right:1px;font-family:'MPLUS1Code',monospace}
.flow-sign{font-size:11px;color:#aaa;text-align:center;white-space:nowrap}
/* 新版流年流月流日 */
.flow-new-section{margin:0 0 20px}
.flow-new-grid{display:grid;gap:6px}
.flow-year-grid{grid-template-columns:repeat(3,1fr)}
.flow-month-grid{grid-template-columns:repeat(4,1fr)}
.flow-new-cell{border:1px solid #e8e8e8;border-radius:6px;padding:6px 4px;text-align:center}
.flow-new-label{font-size:11px;color:#999;margin-bottom:4px;font-family:'MPLUS1Code',monospace}
.flow-new-val{display:flex;align-items:baseline;justify-content:center;gap:1px;line-height:1.4}
.screenshot-btn{display:none}
.screenshot-btn-wrap{display:none}
@media(min-width:768px){.screenshot-btn{display:inline-block}.screenshot-btn-wrap{display:block}}
.flow-hl-label{font-weight:700;color:#b8860b}
.flow-hl-box,.flow-hl-single{background:#FFFDF5;box-shadow:0 0 0 2px #F0D080;border-radius:4px}.flow-hl-box .flow-hl-single{box-shadow:none;border-radius:0;background:transparent}
/* 流日月曆 */
.flow-cal-grid{border:1px solid #e8e8e8;border-radius:8px;overflow:hidden;background:#e8e8e8}
.flow-cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e8e8e8}
.flow-cal-head{font-size:11px;color:#999;text-align:center;padding:3px 0;font-family:'MPLUS1Code',monospace;background:#fff;border-bottom:1px solid #e8e8e8}
.flow-cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e8e8e8}
.flow-cal-cell{padding:4px 2px;text-align:center;min-height:48px;background:#fff}
.flow-cal-cell.flow-cal-empty{background:#f9f9f9}
.flow-cal-day{font-size:10px;color:#999;margin-bottom:3px;font-family:'MPLUS1Code',monospace}
.flow-cal-today{color:#b8860b;font-weight:700}
.flow-cal-body .flow-new-val{font-size:8px;line-height:1.2}
.flow-cal-body .flow-path{font-size:8px}
.flow-cal-body .flow-dest{font-size:9px}
.flow-cal-body .flow-lv{font-size:7px;vertical-align:sub}
.flow-cal-body .sign{font-size:9px}
.flow-cal-body .flow-hl-box{border-radius:3px}
.flow-year-table{padding:32px 0 8px}
.flow-year-title{font-size:14px;font-weight:500;color:#1a1a1a;margin:0 12px 12px;font-family:'M PLUS Rounded 1c',sans-serif;text-align:center}
.fyt-group{margin-bottom:8px;padding:0;overflow-x:auto}
.fyt-grid{display:grid;grid-template-columns:repeat(9,1fr);border:1px solid #e0e0e0;border-radius:4px;overflow:hidden;width:100%;position:relative}
.fyt-grid::before,.fyt-grid::after{content:'';position:absolute;top:0;bottom:0;width:1px;background:#e0e0e0;z-index:5;pointer-events:none}
.fyt-grid::before{left:calc(100%/9*3)}
.fyt-grid::after{left:calc(100%/9*6)}
.fyt-col{display:flex;flex-direction:column;position:relative}
.fyt-col-current{outline:2px solid #F0D080;outline-offset:-2px;border-radius:3px;z-index:2;background:#FFFDF5}
.fyt-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px 0;border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;overflow:hidden;min-width:0}
.fyt-col:last-child .fyt-cell{border-right:none}
.fyt-cell.age-row{background:#fff;border-bottom:1px solid #ddd}
.fyt-cell.year-row{border-bottom:1px solid #e0e0e0}
.fyt-cell.num-row{border-bottom:none}
.fyt-age{font-size:8px;color:#999;font-family:'MPLUS1Code',monospace;display:block;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fyt-year{font-size:8px;color:#333;font-family:'MPLUS1Code',monospace;display:block;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fyt-num{font-size:8px;color:#888;font-family:'MPLUS1Code',monospace;display:block;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fyt-num .d{color:#1a1a1a;font-weight:400}
.fyt-num .lv{font-size:6px;color:#4a90d9;vertical-align:super}
.fyt-col-current .fyt-year{font-weight:700;color:#b8860b}
.fyt-col-current .fyt-age{font-weight:700;color:#b8860b}
.fyt-col-current .fyt-num{font-weight:700}
.fyt-col-current .fyt-num .d{font-weight:700;color:#b8860b}
/* 指導靈底色：歲次=六次元粉藍，西元=五次元粉黃，主秘數=四次元粉紅 */
.fyt-cell.age-row.g6{background:#d6eaff}
.fyt-cell.year-row.g5{background:#fff9d6}
.fyt-cell.num-row.g4{background:#ffd6d6}
.error{padding:20px;color:#c0392b;font-size:13px;text-align:center}
.hidden{display:none}
.panel{display:none}.panel.active{display:block}
/* 圖例 */
.guardian-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px 4px;font-size:10px;color:#888;font-family:'M PLUS Rounded 1c',sans-serif}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* 隱藏生日按鈕 */
.bd-toggle-btn{padding:4px 14px;border-radius:14px;border:1px solid #bbb;background:#fff;font-size:12px;color:#888;cursor:pointer;font-family:'M PLUS Rounded 1c',sans-serif;line-height:1.6}
.bd2-hint-row{text-align:right;margin:-2px 0 12px;padding:0 2px}
.bd2-hint-btn{border:none;background:none;color:#bbb;font-size:11px;letter-spacing:.02em;cursor:pointer;padding:2px;font-family:'M PLUS Rounded 1c',sans-serif}
.bd2-row{margin-bottom:0}
/* 九宮格 */
.nine-grid-wrap{display:flex;gap:12px;justify-content:center;margin-top:16px}
.nine-grid-collapsible{overflow:hidden;transition:max-height 0.3s ease;max-height:300px}
.nine-grid-collapsible.collapsed{max-height:0}
.nine-grid-side{flex:1;min-width:0}
.nine-grid-label{font-size:11px;color:#999;text-align:center;margin-bottom:6px;font-family:'MPLUS1Code',monospace;letter-spacing:.05em}
.nine-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.nine-grid-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px}
.nine-cell{border:1px solid #ccc;border-radius:3px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:32px;background:#fff}
.nine-cell-spacer{height:8px;flex-shrink:0}
.nine-cell-num{font-size:12px;font-family:'MPLUS1Code',monospace;color:#1a1a1a;font-weight:500;line-height:1;text-align:center}
.nine-cell-empty{min-height:24px}
/* 九宮格來源標記：紅圓＝先天數、藍三角＝後天數、綠方＝主命數；出現一次畫一個，左上角由上而下、滿三個換行 */
.nine-cell-shapes{position:absolute;left:4px;top:3px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,7px);gap:2px;pointer-events:none}
.nine-cell-shapes svg{width:7px;height:7px;display:block;flex:none}
/* 九宮格圖例：放在九宮格下方，跟著九宮格一起收合 */
.nine-legend-inner{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px;font-size:11px;color:#1a1a1a;letter-spacing:.05em;font-family:'M PLUS Rounded 1c',sans-serif}
.nine-legend-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.nine-legend-item svg{width:9px;height:9px;display:block;flex:none}
/* 紀錄面板 */

.pp-block .num-row+.num-header{margin-top:8px}

.rhythm-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:8px 2px 12px}

   縮小到手機寬度能一次看到緣 9 組、份至少 5 組，不影響 iPad 原本大小 */
@media(max-width:767px){
  .relnum-matrix{min-width:0}
  .relnum{font-size:11px}
  .relnum-mid{gap:3px}
  .relnum-mid .relnum{min-width:13px}
  .relnum-bkt{font-size:15px}

  .rhythm-slot-bottom{margin-top:4px}
  .rhythm-date,.rhythm-flow{font-size:7px}
  .rhythm-name{font-size:7px}
  /* 份的矩陣比緣多一層日期/姓名/流年標籤，六欄需要比緣的九宮格更緊縮；
     以下只作用在 .rhythm-seg 內，不影響緣（bond-row）已實測確認的尺寸 */
  .rhythm-seg .relnum{font-size:9px}
  .rhythm-seg .relnum-mid{gap:2px}
  .rhythm-seg .relnum-mid .relnum{min-width:9px}
  .rhythm-seg .relnum-bkt{font-size:13px}
  .rhythm-seg .relnum-inner{grid-template-columns:repeat(2,8px);gap:1px 2px;font-size:8px;padding:1px 2px}
  .rhythm-seg .relnum-label,.rhythm-seg .relnum-sub{font-size:7px}
}

/* 寬螢幕（平板／桌機）專用：合盤面板拉寬，矩陣與文字同步放大，
   避免面板寬度變大但內容沒跟著長大、兩側留白過多的問題；
   不影響 767px 以下手機版已實測確認的尺寸 */
@media(min-width:768px){

  .pair-persons .cal-sign{font-size:10px}
  .pair-sec-title{font-size:16px}
  .pair-sec-sub{font-size:11px}
  .relnum-matrix{min-width:80px}
  .relnum{font-size:16px}
  .relnum-mid{gap:6px}
  .relnum-mid .relnum{min-width:22px}
  .relnum-bkt{font-size:22px}
  .relnum-inner{grid-template-columns:repeat(2,15px);gap:1px 7px;font-size:13px;padding:3px 6px}
  .relnum-label,.relnum-sub{font-size:11px}
  .bond-row{gap:10px}
  .rhythm-strip{padding:10px 4px 14px}
  .rhythm-seg{padding:0 4px}
  .rhythm-slot{min-height:42px}
  .rhythm-date{font-size:11px}
  .rhythm-name{font-size:10px}
  .rhythm-flow{font-size:10px}
  .rhythm-nav-btn{font-size:12px;padding:5px 12px}
  .rhythm-nav-range{font-size:12px}
  /* 份是固定六欄 grid，不能像緣那樣橫向捲動；矩陣不能跟著緣一起放大到頂，
     否則六欄裝不下會擠壓重疊，所以在此單獨縮小，只作用在 .rhythm-seg 內 */
  .rhythm-seg .relnum-matrix{min-width:0}
  .rhythm-seg .relnum{font-size:13px}
  .rhythm-seg .relnum-mid{gap:4px}
  .rhythm-seg .relnum-mid .relnum{min-width:14px}
  .rhythm-seg .relnum-bkt{font-size:16px}
  .rhythm-seg .relnum-inner{grid-template-columns:repeat(2,10px);gap:1px 4px;font-size:10px;padding:2px 4px}
  .rhythm-seg .relnum-label,.rhythm-seg .relnum-sub{font-size:9px}
}

// ── Lunar ─────────────────────────────────────────────────────
function solarToLunar(sy,sm,sd){
  try{
    const solar=Solar.fromYmd(sy,sm,sd);
    const lunar=solar.getLunar();
    const lm=lunar.getMonth(); // 負數代表閏月
    const isLeap=lm<0;
    return{year:lunar.getYear(),month:Math.abs(lm),day:lunar.getDay(),isLeap};
  }catch(e){return null;}
}

function lunarToSolar(ly,lm,ld){
  try{
    const nextLm=lm===12?1:lm+1;
    const nextLy=lm===12?ly+1:ly;
    const lunar=Lunar.fromYmd(nextLy,nextLm,ld);
    const solar=lunar.getSolar();
    return{year:solar.getYear(),month:solar.getMonth(),day:solar.getDay()};
  }catch(e){return null;}
}

// ── Numerology ────────────────────────────────────────────────
function digs(n){return String(Math.abs(Math.floor(n))).split('').map(Number);}
// 回傳 {pathNums: [...], destinyNums: [...]} 保留重複，分開後天數和主命數
function destinyBreakdown(total){
  if(total===0) return{pathNums:[0],destinyNums:[0]};
  // 主命數加總為個位數（0X/X）：依 Excel 九宮圖，前導0與第一個X都算後天數，最後的X算主命數 → 0、X、X
  if(total<10) return{pathNums:[0,total],destinyNums:[total]};
  const parts=[];let n=total;
  while(n>=10){parts.push(n);n=digs(n).reduce((a,b)=>a+b,0);}
  parts.push(n);
  const destiny=parts[parts.length-1];
  const pathAll=[];
  for(const p of parts.slice(0,-1)){
    if(p>=10) digs(p).forEach(d=>pathAll.push(d));
    else pathAll.push(p);
  }
  return{pathNums:pathAll,destinyNums:[destiny]};
}
function sumArr(a){return a.reduce((x,y)=>x+y,0);}
function reduce(total){
  const parts=[total];let n=total;
  while(n>=10){n=digs(n).reduce((a,b)=>a+b,0);parts.push(n);}
  return parts;
}
function makeStage(total){
  if(total===0) return{str:'0',checkStr:'0',destiny:0,pathNums:[]};
  const parts=reduce(total);
  // 加總若得一位數，補 0 成 02/2（純顯示格式，這個補的0不是真正的數字）
  const str=parts.length===1?`0${parts[0]}/${parts[0]}`:parts.join('/');
  // checkStr：揚升計畫判斷0/9專用，不含補零——依講義補充資料，補零湊格式的「外在0」不算揚升計畫的0，
  // 只有加總本身真正產生的0（例如20/2、10/1裡的0）才算。
  // 個位數加總只去掉補的0，其餘數字照算：09/9 → "9/9"，揚升計畫算兩顆9（同 Excel）
  const checkStr=parts.length===1?`${parts[0]}/${parts[0]}`:parts.join('/');
  const destiny=parts[parts.length-1];
  const pathNums=[];
  if(parts.length===1){pathNums.push(0);pathNums.push(parts[0]);}
  for(let i=0;i<parts.length-1;i++){
    const p=parts[i];
    if(p>=10) digs(p).forEach(d=>{if(!pathNums.includes(d))pathNums.push(d);});
    else if(!pathNums.includes(p)) pathNums.push(p);
  }
  return{str,checkStr,destiny,pathNums};
}
function calcStages(y,m,d,h,mn){
  const yD=digs(y),mD=p2(m).split('').map(Number),dD=p2(d).split('').map(Number);
  const innate=[...yD,...mD,...dD];
  const stages=[];
  stages.push({name:'老年',...makeStage(sumArr(yD))});
  stages.push({name:'中年',...makeStage(sumArr([...yD,...mD]))});
  stages.push({name:'青年',...makeStage(sumArr([...yD,...mD,...dD])),isDestiny:true});
  if(h!==null){
    stages.push({name:'少年',...makeStage(sumArr([...yD,...mD,...dD,...digs(h)]))});
    if(mn!==null){
      stages.push({name:'幼年',...makeStage(sumArr([...yD,...mD,...dD,...digs(h),...digs(mn)]))});
    }
  }
  const order=['幼年','少年','青年','中年','老年'];
  stages.sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name));
  return{innate,stages};
}
function calcLevel(innate,destiny,pathNums){
  const set=new Set(innate);
  const hasD=set.has(destiny);
  const allP=pathNums;
  const hasAllP=allP.length>0&&allP.every(n=>set.has(n));
  const hasSomeP=allP.length>0&&allP.some(n=>set.has(n));
  const counts={};
  for(const n of innate){if(n>0)counts[n]=(counts[n]||0)+1;}
  const hasObs=Object.values(counts).some(c=>c>=3);
  let level;
  if(!hasD&&!hasSomeP) level=1;
  else if(!hasD&&hasSomeP&&!hasAllP) level=2;
  else if(!hasD&&hasAllP) level=3;
  else if(hasD&&allP.length===0) level=4;
  else if(hasD&&!hasSomeP&&allP.length>0) level=4;
  else if(hasD&&hasSomeP&&!hasAllP) level=5;
  else if(hasD&&hasAllP&&hasObs) level=6;
  else level=7;
  return{level};
}
// ── Guardian Logic ────────────────────────────────────────────
// 判斷一個 stage 是否符合指導靈辨識條件
function isG4(stage){ // 29/11/2 or 11/2 (尾數2，前一層含11)
  const s=stage.str;
  return s==='29/11/2'||s==='11/2';
}
function isG5(stage){ // 39/12/3 or 12/3
  const s=stage.str;
  return s==='39/12/3'||s==='12/3';
}
function isG6(stage){ // 19/10/1 or 10/1
  const s=stage.str;
  return s==='19/10/1'||s==='10/1';
}

// 計算每個指導靈的啟動區間 [{start, end}]
// start = 第一次出現辨識條件的歲次
// end = 下一個尾數相同但不符合辨識條件的前一年的歲次，或99
function calcGuardianRanges(birthY,birthM,birthD){
  // 建立1-99歲的流年主秘數
  const rows=[];
  for(let age=1;age<=99;age++){
    const year=birthY+age-1;
    const fyD=digs(year),mD=p2(birthM).split('').map(Number),dD=p2(birthD).split('').map(Number);
    const stage=makeStage(sumArr([...fyD,...mD,...dD]));
    rows.push({age,stage});
  }

  function getRanges(isMatch){
    const ranges=[];
    let inRange=false;
    let startAge=null;
    const matchDestiny=isMatch===isG4?2:isMatch===isG5?3:1;
    for(let i=0;i<rows.length;i++){
      const{age,stage}=rows[i];
      if(!inRange){
        if(isMatch(stage)){
          inRange=true;
          startAge=age;
        }
      } else {
        // 結束條件：尾數相同但不符合辨識條件
        if(stage.destiny===matchDestiny&&!isMatch(stage)){
          ranges.push({start:startAge,end:age-1});
          // 檢查這個不符合的之後有沒有再次符合
          inRange=false;
          startAge=null;
          // 退回重新檢查這個 age 是否是新的啟動
          if(isMatch(stage)){
            inRange=true;
            startAge=age;
          }
        }
      }
    }
    if(inRange) ranges.push({start:startAge,end:99});
    return ranges;
  }

  return{
    g4:getRanges(isG4),
    g5:getRanges(isG5),
    g6:getRanges(isG6)
  };
}

function inRanges(age,ranges){
  return ranges.some(r=>age>=r.start&&age<=r.end);
}

function p2(n){return n<10?'0'+n:String(n);}

function renderCalSection(el,isGreg,dateStr,y,m,d,h,mn,innate,showBtn=true,isLeapMonth=false){
  const title='<span class="cal-label">'+(isGreg?t('greg'):t('lun'))+'</span><span class="cal-sign">'+(isGreg?'(+)':'(-)')+'</span>';
  const{stages}=calcStages(y,m,d,h,mn);
  const hasTime=h!==null,hasMins=mn!==null;
  const cols=hasTime?(hasMins?5:4):3;
  const dateParts=[y,m,d];
  if(hasTime) dateParts.push(h);
  if(hasMins) dateParts.push(mn);
  const colStyle=`grid-template-columns:repeat(${cols},1fr);`;
  let headerCells=dateParts.map((v,i)=>{
    if(i===1&&isLeapMonth) return`<div class="num-cell label"><span class="leap-badge">${t('leap')}</span>${p2(v)}</div>`;
    return`<div class="num-cell label">${i===0?v:p2(v)}</div>`;
  }).join('');
  const stageOrder=['老年','中年','青年','少年','幼年'].slice(0,cols);
  let stageCells=stageOrder.map(name=>{
    const s=stages.find(x=>x.name===name);
    if(!s) return`<div class="num-cell"></div>`;
    const lv=calcLevel(innate,s.destiny,s.pathNums);
    const isd=name==='青年';
    const parts=s.str.split('/');
    const fmt=parts.map((p,i)=>i===parts.length-1?`<span class="stage-dest">${p}</span>`:`<span class="stage-path">${p}/</span>`).join('');
    return`<div class="num-cell"><div class="stage-val">
      <span class="stage-num${isd?' destiny':''}">${fmt}</span>
      <span class="stage-lv">${lv.level}</span>
    </div></div>`;
  }).join('');
  const hdId='hd-'+(isGreg?'greg':'lun')+'-'+y+m+d;
  const btnHtml=(isGreg&&showBtn)?`<button id="btn-bd-toggle" class="bd-toggle-btn" style="position:absolute;right:0" onclick="toggleAllBdHeaders(this)">${t('hideBd')}</button>`:''
  el.innerHTML=`
  <div class="cal-title" style="display:flex;align-items:center;justify-content:center;position:relative"><span style="flex:1;text-align:center">${title}</span>${btnHtml}</div>
  <div id="${hdId}" class="num-header bd-header" style="${colStyle}">${headerCells}</div>
  <div class="num-row" style="${colStyle}">${stageCells}</div>`;
}

function renderNineGrids(gInnate,lInnate,gPathNums,lPathNums,gDestNums,lDestNums,gDestinyStr,lDestinyStr,elId){
  elId=elId||'nineGridSection';
  gPathNums=gPathNums||[];lPathNums=lPathNums||[];
  gDestNums=gDestNums||[];lDestNums=lDestNums||[];
  // 來源標記（空心幾何）：先天數＝紅圓、後天數＝藍三角、主命數＝綠方，出現幾次畫幾個，順序固定紅→藍→綠
  const SHAPE_CIRCLE='<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.9" fill="none" stroke="#EE9A9A" stroke-width="1.4"/></svg>';
  const SHAPE_TRIANGLE='<svg viewBox="0 0 10 10"><polygon points="5,1.2 9.2,9 0.8,9" fill="none" stroke="#92BBE6" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  const SHAPE_SQUARE='<svg viewBox="0 0 10 10"><rect x="1.4" y="1.4" width="7.2" height="7.2" fill="none" stroke="#86C9A2" stroke-width="1.4"/></svg>';
  function shapesHtml(iCnt,pCnt,dCnt){
    if(iCnt+pCnt+dCnt===0) return'';
    return`<div class="nine-cell-shapes">${SHAPE_CIRCLE.repeat(iCnt)}${SHAPE_TRIANGLE.repeat(pCnt)}${SHAPE_SQUARE.repeat(dCnt)}</div>`;
  }
  function makeCell(num,innate,pathNums,destNums){
    const iCnt=innate.filter(n=>n===num).length;
    const dCnt=destNums.filter(n=>n===num).length;
    const pCnt=pathNums.filter(n=>n===num).length;
    const total=iCnt+pCnt+dCnt;
    const countHtml=total>0
      ?`<span style="position:absolute;bottom:3px;right:4px;color:#888;font-size:10px;font-weight:700;line-height:1">×${total}</span>`
      :'';
    let cellStyle='position:relative;';
    if(dCnt>0) cellStyle+='background:#FFF8E1;outline:2px solid #F0D080;outline-offset:-1px';
    else if(pCnt>0) cellStyle+='background:#FFFDF5';
    return`<div class="nine-cell" style="${cellStyle}"><div class="nine-cell-spacer"></div><span class="nine-cell-num">${num}</span><div class="nine-cell-spacer"></div>${shapesHtml(iCnt,pCnt,dCnt)}${countHtml}</div>`;
  }
  function makeGrid(innate,pathNums,destNums){
    const rows=[[1,4,7],[2,5,8],[3,6,9]];
    const gridHtml=rows.map(row=>`<div style="display:contents">${row.map(n=>makeCell(n,innate,pathNums,destNums)).join('')}</div>`).join('');
    const ziCnt=innate.filter(n=>n===0).length;
    const zpCnt=pathNums.filter(n=>n===0).length;
    const zdCnt=destNums.filter(n=>n===0).length;
    const zTotal=ziCnt+zpCnt+zdCnt;
    const zeroHtml=zTotal>0
      ?`<span style="position:absolute;bottom:3px;right:4px;color:#888;font-size:10px;font-weight:700;line-height:1">×${zTotal}</span>`
      :'';
    let zCellStyle='position:relative;';
    if(zdCnt>0) zCellStyle+='background:#FFF8E1;outline:2px solid #F0D080;outline-offset:-1px';
    else if(zpCnt>0) zCellStyle+='background:#FFFDF5';
    return`<div class="nine-grid">${gridHtml}</div><div class="nine-grid-row3"><div class="nine-cell-empty"></div><div class="nine-cell" style="${zCellStyle}"><div class="nine-cell-spacer"></div><span class="nine-cell-num">0</span><div class="nine-cell-spacer"></div>${shapesHtml(ziCnt,zpCnt,zdCnt)}${zeroHtml}</div><div class="nine-cell-empty"></div></div>`;
  }
  function makeInnateNums(innate){
    const counts={};
    for(const n of innate){if(n>0)counts[n]=(counts[n]||0)+1;}
    const sorted=[...innate].sort((a,b)=>a-b);
    return sorted.map(n=>{
      const c=counts[n]||0;
      const cls=n===0?'inn':(c>=3?'inn obs':(c>=1?'inn has':'inn'));
      return`<span class="${cls}">${n}</span>`;
    }).join('');
  }
  const el=document.getElementById(elId);
  if(!el) return;
  const gridHtmlStr=`
    <div class="nine-grid-wrap">
      <div class="nine-grid-side">
        <div class="nine-grid-label" style="font-size:13px;color:#1a1a1a;text-align:center;margin-bottom:8px;font-family:'MPLUS1Code',monospace">${t('greg')}(+)</div>
        <div class="innate-nums" style="justify-content:center;margin-bottom:8px">${makeInnateNums(gInnate)}</div>
        <div class="nine-grid-collapsible">${makeGrid(gInnate,gPathNums,gDestNums)}</div>
      </div>
      <div class="nine-grid-side">
        <div class="nine-grid-label" style="font-size:13px;color:#1a1a1a;text-align:center;margin-bottom:8px;font-family:'MPLUS1Code',monospace">${t('lun')}(-)</div>
        <div class="innate-nums" style="justify-content:center;margin-bottom:8px">${makeInnateNums(lInnate)}</div>
        <div class="nine-grid-collapsible">${makeGrid(lInnate,lPathNums,lDestNums)}</div>
      </div>
    </div>
    <div class="nine-grid-collapsible nine-grid-legend"><div class="nine-legend-inner"><span class="nine-legend-item">${SHAPE_CIRCLE}${t('nineLegendInnate')}</span><span class="nine-legend-item">${SHAPE_TRIANGLE}${t('nineLegendPath')}</span><span class="nine-legend-item">${SHAPE_SQUARE}${t('nineLegendPrime')}</span></div></div>
    `;
  // 保留已有內容（如標題），只移除舊的 nine-grid-wrap 與圖例
  const existing=el.querySelector('.nine-grid-wrap');
  const wasExpanded=existing&&!existing.querySelector('.nine-grid-collapsible.collapsed');
  if(existing) existing.remove();
  const oldLegend=el.querySelector('.nine-grid-legend');
  if(oldLegend) oldLegend.remove();
  el.insertAdjacentHTML('beforeend',gridHtmlStr);
  if(!wasExpanded){
    el.querySelectorAll('.nine-grid-collapsible').forEach(w=>w.classList.add('collapsed'));
  }
  const nineGridToggleBtn=document.querySelector('#innateTitle button[onclick="toggleNineGrid(this)"]');
  if(nineGridToggleBtn){
    nineGridToggleBtn.textContent=wasExpanded?(lang==='en'?'Collapse ▲':'收合 ▲'):(lang==='en'?'Expand ▼':'展開 ▼');
  }
}

// ── 流年流月流日共用計算 ──
function calcFlowData(gregY,gregM,gregD,lunY,lunM,lunD,todayY,todayM,todayD){
  const gBdPassed=(todayM>gregM)||(todayM===gregM&&todayD>=gregD);
  const gFY=gBdPassed?todayY:todayY-1;
  const gDayPassed=todayD>=gregD;
  let gFM=todayM;
  if(!gDayPassed){gFM=todayM-1;if(gFM<1)gFM=12;}
  const lunarToday=solarToLunar(todayY,todayM,todayD);
  const lty=lunarToday?lunarToday.year:todayY;
  const ltm=lunarToday?lunarToday.month:todayM;
  const ltd=lunarToday?lunarToday.day:todayD;
  const lBdPassed=(ltm>lunM)||(ltm===lunM&&ltd>=lunD);
  const lFY=lBdPassed?lty:lty-1;
  const lDayPassed=ltd>=lunD;
  let lFM=ltm;
  if(!lDayPassed){lFM=ltm-1;if(lFM<1)lFM=12;}
  const gInnate=String(gregY).split('').concat(p2(gregM).split(''),p2(gregD).split('')).map(Number);
  const lInnate=String(lunY).split('').concat(p2(lunM).split(''),p2(lunD).split('')).map(Number);
  return{gFY,gFM,lFY,lFM,gInnate,lInnate};
}

function flowLvBadge(s,innate,bold=false){
  const lv=calcLevel(innate,s.destiny,s.pathNums);
  const parts=s.str.split('/');
  const fw=bold?'font-weight:700;':'';
  const pathHtml=parts.slice(0,-1).map(p=>`<span class="flow-path" style="${fw}">${p}/</span>`).join('');
  const destHtml=`<span class="flow-dest" style="${fw}">${parts[parts.length-1]}</span>`;
  return pathHtml+destHtml+`<span class="flow-lv" style="${fw}">${lv.level}</span>`;
}

// ── 流年 ──
function renderFlowYear(el,sets,todayY,todayM,todayD){
  // sets = [{gregY,gregM,gregD,lunY,lunM,lunD,sup}] 1或2組，sup='¹'或'²'
  const prevGrid=el.querySelector('.flow-new-grid,.flow-cal-wrap');
  const wasExpanded=prevGrid&&prevGrid.style.display!=='none';
  let html='<div class="flow-new-section">';
  sets.forEach((s,idx)=>{
    const{gFY,lFY,gInnate,lInnate}=calcFlowData(s.gregY,s.gregM,s.gregD,s.lunY,s.lunM,s.lunD,todayY,todayM,todayD);
    const gFYS=makeStage(sumArr([...digs(gFY),...digs(s.gregM),...digs(s.gregD)]));
    const lFYS=makeStage(sumArr([...digs(lFY),...digs(s.lunM),...digs(s.lunD)]));
    const fyBtn=idx===0?'<button onclick="toggleFlowSection(this)" class="flow-toggle-btn">▼</button>':'<span class="flow-arrow-hidden">▲</span>';
    const gR=_phaseRangeGreg(gFY,s.gregM,s.gregD),lR=_phaseRangeLunar(lFY,s.lunM,s.lunD);
    const titleDiv=_flowTitleRows(idx===0?t('flowYear'):'　　',fyBtn,_flowRangeSide('+',gR.start,gR.end),_flowRangeSide('-',lR.start,lR.end),`+${flowLvBadge(gFYS,gInnate,true)}`,`-${flowLvBadge(lFYS,lInnate,true)}`);
    const centerY=Math.max(gFY,lFY);
    const fyYears=[centerY-1,centerY,centerY+1];
    const fyLabels=fyYears.map(yr=>String(yr));
    const fyCells=fyYears.map(yr=>{
      const gS=makeStage(sumArr([...digs(yr),...digs(s.gregM),...digs(s.gregD)]));
      const lS=makeStage(sumArr([...digs(yr),...digs(s.lunM),...digs(s.lunD)]));
      const isGCurr=(yr===gFY);
      const isLCurr=(yr===lFY);
      const isCurr=isGCurr||isLCurr;
      const bothActive=isGCurr&&isLCurr;
      const gVal=`<div class="flow-new-val${isGCurr?' flow-hl-single':''}"><span class="sign">+</span>${flowLvBadge(gS,gInnate,isGCurr)}</div>`;
      const lVal=`<div class="flow-new-val${isLCurr?' flow-hl-single':''}"><span class="sign">-</span>${flowLvBadge(lS,lInnate,isLCurr)}</div>`;
      let inner;
      if(bothActive) inner=`<div class="flow-hl-box">${gVal}${lVal}</div>`;
      else inner=`${gVal}${lVal}`;
      return`<div class="flow-new-cell">
        <div class="flow-new-label${isCurr?' flow-hl-label':''}">${fyLabels[fyYears.indexOf(yr)]}</div>
        ${inner}
      </div>`;
    }).join('');
    const gridDiv=`<div class="flow-new-grid flow-year-grid">${fyCells}</div>`;
    if(idx===0) html+=titleDiv+gridDiv;
    else html+=`<div class="rec-divider">${titleDiv}${gridDiv}</div>`;
  });
  html+='</div>';
  el.innerHTML=html;
  if(!wasExpanded){
    el.querySelectorAll('.flow-new-grid,.flow-cal-wrap').forEach(g=>g.style.display='none');
    const btn=el.querySelector('[onclick="toggleFlowSection(this)"]');
    if(btn) btn.textContent='▼';
  }
}

// ── 位格三角形：9個固定位置（順時針，左下=1，頂點=4，右下=7），目前位格顯示完整流年字串 ──
function _phaseTrianglePoints(){
  const BL={x:25,y:185}, BR={x:195,y:185};
  const side=BR.x-BL.x;
  const apex={x:(BL.x+BR.x)/2, y:BL.y-side*Math.sqrt(3)/2};
  const lerp=(a,b,tt)=>({x:a.x+(b.x-a.x)*tt,y:a.y+(b.y-a.y)*tt});
  return{
    pts:[BL, lerp(BL,apex,1/3), lerp(BL,apex,2/3), apex,
         lerp(apex,BR,1/3), lerp(apex,BR,2/3), BR,
         lerp(BR,BL,1/3), lerp(BR,BL,2/3)],
    apex,BL,BR
  };
}
function _phaseFlowTspans(sign,str,lv){
  // 配色比照流年卡片：路徑段落用 #999，最後的位格數用 #1a1a1a，等級用 #4a90d9（皆粗體，因為這裡只顯示目前流年）
  const parts=str.split('/');
  let out=`<tspan fill="#1a1a1a">${sign}</tspan>`;
  parts.forEach((p,i)=>{
    if(i===parts.length-1) out+=`<tspan fill="#1a1a1a">${p}</tspan>`;
    else out+=`<tspan fill="#999">${p}/</tspan>`;
  });
  if(lv!==undefined&&lv!==null) out+=`<tspan fill="#4a90d9" font-size="8">${lv}</tspan>`;
  return out;
}
function _phaseTriangleSVG(sign,currentK,currentStr,currentLv){
  const{pts,apex,BL,BR}=_phaseTrianglePoints();
  const cx=(apex.x+BL.x+BR.x)/3, cy=(apex.y+BL.y+BR.y)/3;
  const margin=12,cornerMargin=margin/Math.sin(Math.PI/6);
  const vertexInset=v=>{const dx=v.x-cx,dy=v.y-cy,len=Math.hypot(dx,dy);return{x:v.x-dx/len*cornerMargin,y:v.y-dy/len*cornerMargin};};
  const apexIn=vertexInset(apex),BLIn=vertexInset(BL),BRIn=vertexInset(BR);
  const lerp=(a,b,tt)=>({x:a.x+(b.x-a.x)*tt,y:a.y+(b.y-a.y)*tt});
  const innerPts=[BLIn, lerp(BLIn,apexIn,1/3), lerp(BLIn,apexIn,2/3), apexIn,
                  lerp(apexIn,BRIn,1/3), lerp(apexIn,BRIn,2/3), BRIn,
                  lerp(BRIn,BLIn,1/3), lerp(BRIn,BLIn,2/3)];
  let svg=`<svg class="phase-svg" viewBox="0 9 220 199" xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<polygon class="phase-edge" points="${apex.x},${apex.y} ${BL.x},${BL.y} ${BR.x},${BR.y}"/>`;
  pts.forEach((p,i)=>{
    const k=i+1;
    const isCurrent=(k===currentK);
    const innerX=innerPts[i].x, innerY=innerPts[i].y;
    const r=isCurrent?3.6:2;
    svg+=`<circle class="phase-dot${isCurrent?' current':''}" cx="${p.x}" cy="${p.y}" r="${r}"${isCurrent?' stroke="#fff" stroke-width="0.8"':''}/>`;
    svg+=`<text class="phase-pos${isCurrent?' current':''}" x="${innerX}" y="${innerY}" text-anchor="middle" dominant-baseline="middle">${k}</text>`;
    if(isCurrent){
      const dx=p.x-cx, dy=p.y-cy, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len;
      const gap=7;
      let anchor='middle', outerX=p.x, outerY=p.y+uy*14;
      if(k===1){
        // 位格1：顯示在點的上方、三角形左側，稍微往右上偏移避免跑出邊緣
        anchor='end'; outerX=p.x+2; outerY=p.y-16;
      } else if(k===7||k===8||k===9){
        // 底邊上其餘的點固定往下方同樣距離對齊，不受uy大小影響
        anchor='middle'; outerX=p.x; outerY=BL.y+15;
      } else if(Math.abs(ux)>0.15){
        anchor=ux>0?'start':'end';
        outerX=p.x+ux*gap+(ux>0?2:-2);
        outerY=p.y+uy*gap;
      }
      svg+=`<text class="phase-flow" x="${outerX}" y="${outerY}" text-anchor="${anchor}" dominant-baseline="middle">${_phaseFlowTspans(sign,currentStr,currentLv)}</text>`;
    }
  });
  svg+=`</svg>`;
  return svg;
}
// ── 位格區間日期計算 ──
function _phaseRangeGreg(cycleStartY,m,d){
  const p2=n=>n<10?'0'+n:String(n);
  const start=`${cycleStartY}/${p2(m)}/${p2(d)}`;
  const endDate=new Date(cycleStartY+1,m-1,d);
  endDate.setDate(endDate.getDate()-1);
  const end=`${endDate.getFullYear()}/${p2(endDate.getMonth()+1)}/${p2(endDate.getDate())}`;
  return{start,end};
}
function _phaseRangeLunar(cycleStartY,m,d){
  const p2=n=>n<10?'0'+n:String(n);
  const start=`${cycleStartY}/${p2(m)}/${p2(d)}`;
  try{
    // 下一年同農曆月日，轉國曆往前推一天，再轉回農曆，取得區間結束的農曆日期
    // （農曆生日若剛好在閏月，這裡跟其他位格計算一樣，先簡化用同一個月份數字處理，不特別分辨閏月）
    const lunarNext=Lunar.fromYmd(cycleStartY+1,m,d);
    const solarNext=lunarNext.getSolar();
    const d2=new Date(solarNext.getYear(),solarNext.getMonth()-1,solarNext.getDay());
    d2.setDate(d2.getDate()-1);
    const backLunar=Solar.fromYmd(d2.getFullYear(),d2.getMonth()+1,d2.getDate()).getLunar();
    const endM=Math.abs(backLunar.getMonth());
    const end=`${backLunar.getYear()}/${p2(endM)}/${p2(backLunar.getDay())}`;
    return{start,end};
  }catch(e){
    return{start,end:'?'};
  }
}
// ── 流月區間日期計算 ──
// 做法：用跟 calcFlowData 完全相同的「目前流月」判斷規則，從今天往前、往後逐日掃描到流月變動為止，
// 區間就是這一整段。這樣區間永遠跟畫面上標示的目前流月一致（包含生日日是 29～31 號、農曆閏月這類邊界情況）。
function _scanFlowMonthRange(todayY,todayM,todayD,fmOf){
  const base=new Date(todayY,todayM-1,todayD);
  const cur=fmOf(base);
  let s=new Date(base),e=new Date(base);
  for(let i=0;i<70;i++){const p=new Date(s);p.setDate(p.getDate()-1);if(fmOf(p)!==cur)break;s=p;}
  for(let i=0;i<70;i++){const n=new Date(e);n.setDate(n.getDate()+1);if(fmOf(n)!==cur)break;e=n;}
  return{s,e};
}
function _flowMonthRangeGreg(todayY,todayM,todayD,d){
  const p2=n=>n<10?'0'+n:String(n);
  const fmt=dt=>`${dt.getFullYear()}/${p2(dt.getMonth()+1)}/${p2(dt.getDate())}`;
  const{s,e}=_scanFlowMonthRange(todayY,todayM,todayD,dt=>dt.getDate()>=d?dt.getMonth()+1:(dt.getMonth()===0?12:dt.getMonth()));
  return{start:fmt(s),end:fmt(e)};
}
function _flowMonthRangeLunar(todayY,todayM,todayD,d){
  const p2=n=>n<10?'0'+n:String(n);
  if(!solarToLunar(todayY,todayM,todayD)) return{start:'?',end:'?'};
  const lun=dt=>solarToLunar(dt.getFullYear(),dt.getMonth()+1,dt.getDate());
  const fmt=dt=>{const l=lun(dt);return l?`${l.year}/${p2(l.month)}/${p2(l.day)}`:'?';};
  const{s,e}=_scanFlowMonthRange(todayY,todayM,todayD,dt=>{const l=lun(dt);if(!l)return 0;return l.day>=d?l.month:(l.month===1?12:l.month-1);});
  return{start:fmt(s),end:fmt(e)};
}
// 流年／流月標題列下方的區間：左陽曆(+)、右農曆(−)
function _flowRangeSide(sign,start,end){
  if(!end)return`<span class="flow-range-side" style="display:block;text-align:center">${sign}${start}</span>`;
  return`<span class="flow-range-side"><span class="r-a">${sign}${start}</span><span class="r-d">${end?'&nbsp;-&nbsp;':''}</span><span class="r-b">${end||''}</span></span>`;
}
// 流年／流月／流日標題：第一列＝左右兩側顯示區間（流日顯示當天日期）＋標題＋收合鈕；第二列＝流年數／流月數／流日數
function _flowTitleRows(title,btnHtml,gSide,lSide,gBadge,lBadge){
  return`<div class="section-title flow-title-row flow-title-top"><span class="flow-title-mid">${title}</span>${btnHtml}</div>`
    +`<div class="section-title flow-title-row flow-value-row flow-range-row">${gSide}${lSide}</div>`
    +`<div class="section-title flow-title-row flow-value-row"><span class="sign flow-sign">${gBadge}</span><span class="sign flow-sign">${lBadge}</span></div>`;
}
let _phaseNavOffset=0,_phaseSetsCache=null,_phaseTodayCache=null;
function renderPhase(el,sets,todayY,todayM,todayD){
  _phaseSetsCache=sets;
  _phaseTodayCache={todayY,todayM,todayD};
  // 導覽用的參考日期：把「今天」的年份依偏移量往前後推，月日不變
  const refY=todayY+_phaseNavOffset,refM=todayM,refD=todayD;
  let html='<div class="phase-block-inner">';
  sets.forEach((s,idx)=>{
    const{gFY,lFY,gInnate,lInnate}=calcFlowData(s.gregY,s.gregM,s.gregD,s.lunY,s.lunM,s.lunD,refY,refM,refD);
    const gPhase=((gFY-s.gregY+1)%9+9)%9||9;
    const lPhase=((lFY-s.lunY+1)%9+9)%9||9;
    const gStage=makeStage(sumArr([...digs(gFY),...digs(s.gregM),...digs(s.gregD)]));
    const lStage=makeStage(sumArr([...digs(lFY),...digs(s.lunM),...digs(s.lunD)]));
    const gLv=calcLevel(gInnate,gStage.destiny,gStage.pathNums).level;
    const lLv=calcLevel(lInnate,lStage.destiny,lStage.pathNums).level;
    const gRange=_phaseRangeGreg(gFY,s.gregM,s.gregD);
    const lRange=_phaseRangeLunar(lFY,s.lunM,s.lunD);
    const wrap=`<div class="phase-wrap">
      <div class="phase-side">
        <div class="phase-range">+${gRange.start} - ${gRange.end}</div>
        ${_phaseTriangleSVG('+',gPhase,gStage.str,gLv)}
      </div>
      <div class="phase-side">
        <div class="phase-range">-${lRange.start} - ${lRange.end}</div>
        ${_phaseTriangleSVG('-',lPhase,lStage.str,lLv)}
      </div>
    </div>`;
    if(idx===0) html+=wrap;
    else html+=`<div class="rec-divider">${wrap}</div>`;
  });
  html+='</div>';
  el.innerHTML=html;
}
function changePhaseNav(delta){
  if(!_phaseSetsCache||!_phaseTodayCache) return;
  _phaseNavOffset+=delta;
  renderPhase(document.getElementById('phaseBlock'),_phaseSetsCache,_phaseTodayCache.todayY,_phaseTodayCache.todayM,_phaseTodayCache.todayD);
}

// ── 流月流日導航狀態 ──
let _flowDayNavYear=null,_flowDayNavMonth=null,_flowSetsCache=null;
function _resetFlowNav(){_flowDayNavYear=null;_flowDayNavMonth=null;}
function _initFlowNav(sets,nowY,nowM){

  _flowSetsCache=sets;
}
function _reRenderFlowDay(){

}

// ── 流月 ──
function renderFlowMonth(el,sets,todayY,todayM,todayD){
  const prevGrid=el.querySelector('.flow-new-grid,.flow-cal-wrap');
  const wasExpanded=prevGrid&&prevGrid.style.display!=='none';
  const fmMonthLabels=lang==='en'?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']:['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let html='<div class="flow-new-section">';
  sets.forEach((s,idx)=>{
    const{gFM,lFM,gInnate,lInnate}=calcFlowData(s.gregY,s.gregM,s.gregD,s.lunY,s.lunM,s.lunD,todayY,todayM,todayD);
    const gFMS=makeStage(sumArr([...digs(s.gregY),...digs(gFM),...digs(s.gregD)]));
    const lFMS=makeStage(sumArr([...digs(s.lunY),...digs(lFM),...digs(s.lunD)]));
    const fmBtn=idx===0?'<button onclick="toggleFlowSection(this)" class="flow-toggle-btn">▼</button>':'<span class="flow-arrow-hidden">▲</span>';
    const gR=_flowMonthRangeGreg(todayY,todayM,todayD,s.gregD),lR=_flowMonthRangeLunar(todayY,todayM,todayD,s.lunD);
    const titleDiv=_flowTitleRows(idx===0?t('flowMonth'):'　　',fmBtn,_flowRangeSide('+',gR.start,gR.end),_flowRangeSide('-',lR.start,lR.end),`+${flowLvBadge(gFMS,gInnate,true)}`,`-${flowLvBadge(lFMS,lInnate,true)}`);
    const fmCells=fmMonthLabels.map((lbl,i)=>{
      const mo=i+1;
      const isCurrentG=(mo===gFM);
      const isCurrentL=(mo===lFM);
      const isCurrent=isCurrentG||isCurrentL;
      const gS=makeStage(sumArr([...digs(s.gregY),...digs(mo),...digs(s.gregD)]));
      const lS=makeStage(sumArr([...digs(s.lunY),...digs(mo),...digs(s.lunD)]));
      const bothActive=isCurrentG&&isCurrentL;
      const gVal=`<div class="flow-new-val${isCurrentG?' flow-hl-single':''}"><span class="sign">+</span>${flowLvBadge(gS,gInnate,isCurrentG)}</div>`;
      const lVal=`<div class="flow-new-val${isCurrentL?' flow-hl-single':''}"><span class="sign">-</span>${flowLvBadge(lS,lInnate,isCurrentL)}</div>`;
      let inner;
      if(bothActive) inner=`<div class="flow-hl-box">${gVal}${lVal}</div>`;
      else inner=`${gVal}${lVal}`;
      return`<div class="flow-new-cell">
        <div class="flow-new-label${isCurrent?' flow-hl-label':''}">${lbl}</div>
        ${inner}
      </div>`;
    }).join('');
    const gridDiv=`<div class="flow-new-grid flow-month-grid">${fmCells}</div>`;
    if(idx===0) html+=titleDiv+gridDiv;
    else html+=`<div class="rec-divider">${titleDiv}${gridDiv}</div>`;
  });
  html+='</div>';
  el.innerHTML=html;
  if(!wasExpanded){
    el.querySelectorAll('.flow-new-grid,.flow-cal-wrap').forEach(g=>g.style.display='none');
    const btn=el.querySelector('[onclick="toggleFlowSection(this)"]');
    if(btn) btn.textContent='▼';
  }
}

// ── 流日 ──
function renderFlowDay(el,sets,todayY,todayM,todayD){
  const prevGrid=el.querySelector('.flow-new-grid,.flow-cal-wrap');
  const wasExpanded=prevGrid&&prevGrid.style.display!=='none';
  const weekLabels=lang==='en'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['週一','週二','週三','週四','週五','週六','週日'];
  const weekHeaders=weekLabels.map(w=>`<div class="flow-cal-head">${w}</div>`).join('');
  const calYear=todayY,calMonth=todayM;
  const firstDay=new Date(calYear,calMonth-1,1).getDay();
  const startOffset=(firstDay+6)%7;
  const daysInMonth=new Date(calYear,calMonth,0).getDate();
  const monthNames=lang==='en'?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const prevMonthLabel=lang==='en'?'‹ Prev':'‹ 前一月';
  const nextMonthLabel=lang==='en'?'Next ›':'後一月 ›';
  const monthNavHtml=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <button onclick="if(_flowDayNavMonth===1){_flowDayNavMonth=12;_flowDayNavYear--;}else{_flowDayNavMonth--;}_reRenderFlowDay()" style="background:none;border:1px solid #ddd;border-radius:20px;padding:3px 10px;font-size:11px;color:#666;cursor:pointer">${prevMonthLabel}</button>
    <span style="font-size:13px;font-weight:600">${calYear}/${String(calMonth).padStart(2,'0')}</span>
    <button onclick="if(_flowDayNavMonth===12){_flowDayNavMonth=1;_flowDayNavYear++;}else{_flowDayNavMonth++;}_reRenderFlowDay()" style="background:none;border:1px solid #ddd;border-radius:20px;padding:3px 10px;font-size:11px;color:#666;cursor:pointer">${nextMonthLabel}</button>
  </div>`;
  let html='<div class="flow-new-section">';
  sets.forEach((s,idx)=>{
    const{gInnate,lInnate}=calcFlowData(s.gregY,s.gregM,s.gregD,s.lunY,s.lunM,s.lunD,todayY,todayM,todayD);
    // 標題的流日數固定用「真實今天」計算，不隨下方日曆的「前一月／後一月」切換而變動
    const rt=new Date(),rtL=solarToLunar(rt.getFullYear(),rt.getMonth()+1,rt.getDate());
    const gFDS=makeStage(sumArr([...digs(s.gregY),...digs(s.gregM),...digs(rt.getDate())]));
    const lFDS=makeStage(sumArr([...digs(s.lunY),...digs(s.lunM),...digs(rtL?rtL.day:rt.getDate())]));
    const fdBtn=idx===0?'<button onclick="toggleFlowSection(this)" class="flow-toggle-btn">▼</button>':'<span class="flow-arrow-hidden">▲</span>';
    const gDateStr=`${rt.getFullYear()}/${p2(rt.getMonth()+1)}/${p2(rt.getDate())}`;
    const lDateStr=rtL?`${rtL.year}/${p2(rtL.month)}/${p2(rtL.day)}`:'?';
    const titleDiv=_flowTitleRows(idx===0?t('flowDay'):'　　',fdBtn,_flowRangeSide('+',gDateStr),_flowRangeSide('-',lDateStr),`+${flowLvBadge(gFDS,gInnate,true)}`,`-${flowLvBadge(lFDS,lInnate,true)}`);
    function fdStageG(dy){return makeStage(sumArr([...digs(s.gregY),...digs(s.gregM),...digs(dy)]));}
    function fdStageL(dy){
      const lunar=solarToLunar(calYear,calMonth,dy);
      const ld=lunar?lunar.day:dy;
      return makeStage(sumArr([...digs(s.lunY),...digs(s.lunM),...digs(ld)]));
    }
    let calCells='';
    for(let i=0;i<startOffset;i++) calCells+=`<div class="flow-cal-cell flow-cal-empty"></div>`;
    const realToday=new Date();
    const realTodayY=realToday.getFullYear(),realTodayM=realToday.getMonth()+1,realTodayD=realToday.getDate();
    for(let dy=1;dy<=daysInMonth;dy++){
      const isToday=(dy===realTodayD&&calMonth===realTodayM&&calYear===realTodayY);
      calCells+=`<div class="flow-cal-cell${isToday?' flow-current':''}">
        <div class="flow-cal-day${isToday?' flow-cal-today':''}">${dy}</div>
        ${isToday?`<div class="flow-hl-box">`:''}
        <div class="flow-new-val"><span class="sign">+</span>${flowLvBadge(fdStageG(dy),gInnate,isToday)}</div>
        <div class="flow-new-val"><span class="sign">-</span>${flowLvBadge(fdStageL(dy),lInnate,isToday)}</div>
        ${isToday?'</div>':''}
      </div>`;
    }
    const gridDiv=`<div class="flow-cal-wrap">${monthNavHtml}<div class="flow-cal-grid"><div class="flow-cal-week">${weekHeaders}</div><div class="flow-cal-body">${calCells}</div></div></div>`;
    if(idx===0) html+=titleDiv+gridDiv;
    else html+=`<div class="rec-divider">${titleDiv}${gridDiv}</div>`;
  });
  html+='</div>';
  el.innerHTML=html;
  if(!wasExpanded){
    el.querySelectorAll('.flow-new-grid,.flow-cal-wrap').forEach(g=>g.style.display='none');
    const btn=el.querySelector('[onclick="toggleFlowSection(this)"]');
    if(btn) btn.textContent='▼';
  }
}


function renderFlowYearTable(el,birthY,birthM,birthD,innate,isGreg,isLeap,h=null,mn=null){
  const today=new Date();
  const todayY=today.getFullYear();
  const todayM=today.getMonth()+1;
  const todayD=today.getDate();
  let currentYear;
  if(isGreg){
    const birthdayPassed=(todayM>birthM)||(todayM===birthM&&todayD>=birthD);
    currentYear=birthdayPassed?todayY:todayY-1;
  } else {
    const lunarToday=solarToLunar(todayY,todayM,todayD);
    const lty=lunarToday?lunarToday.year:todayY;
    const ltm=lunarToday?lunarToday.month:todayM;
    const ltd=lunarToday?lunarToday.day:todayD;
    const birthdayPassed=(ltm>birthM)||(ltm===birthM&&ltd>=birthD);
    currentYear=birthdayPassed?lty:lty-1;
  }
  const guardianRanges=calcGuardianRanges(birthY,birthM,birthD);

  const rows=[];
  for(let age=1;age<=99;age++){
    const year=birthY+age-1;
    const fyD=digs(year),mD=digs(birthM),dD=digs(birthD);
    const total=sumArr([...fyD,...mD,...dD]);
    const stage=makeStage(total);
    const lv=calcLevel(innate,stage.destiny,stage.pathNums);
    const g4=inRanges(age,guardianRanges.g4);
    const g5=inRanges(age,guardianRanges.g5);
    const g6=inRanges(age,guardianRanges.g6);
    rows.push({age,year,stage,lv,g4,g5,g6});
  }

  const groups=[];
  for(let i=0;i<rows.length;i+=9) groups.push(rows.slice(i,i+9));

  // 圖例
  const legend=`<div class="guardian-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#ffd6d6"></div><span>${t('g4')}</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#fff9d6"></div><span>${t('g5')}</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#d6eaff"></div><span>${t('g6')}</span></div>
  </div>`;

  const sign=isGreg?'<span class="cal-sign">(+)</span>':'<span class="cal-sign">(-)</span>';
  const calTitle=`<span class="cal-label">${isGreg?t('greg'):t('lun')}</span>${sign}`;
  const titleWithDate=`<div class="cal-title">${calTitle}</div>`;
  const hasTime=h!==null,hasMins=mn!==null;
  const ftCols=hasTime?(hasMins?5:4):3;
  const bdParts=[birthY,(isLeap?`<span class="leap-badge">${t('leap')}</span>`:'')+p2(birthM),p2(birthD)];
  if(h!==null) bdParts.push(p2(h));
  if(mn!==null) bdParts.push(p2(mn));
  const bdCells=bdParts.map(v=>`<div class="num-cell label">${v}</div>`).join('');
  const bdHeader=`<div class="num-header" style="grid-template-columns:repeat(${ftCols},1fr)">${bdCells}</div>`;
  // 五大階段數
  const{stages:ftStages}=calcStages(birthY,birthM,birthD,h,mn);
  const ftStageOrder=['老年','中年','青年','少年','幼年'].slice(0,ftCols);
  const ftStageCells=ftStageOrder.map(name=>{
    const s=ftStages.find(x=>x.name===name);
    if(!s) return`<div class="num-cell"></div>`;
    const lv=calcLevel(innate,s.destiny,s.pathNums);
    const isd=name==='青年';
    const parts=s.str.split('/');
    const fmt=parts.map((p,i)=>i===parts.length-1?`<span class="stage-dest">${p}</span>`:`<span class="stage-path">${p}/</span>`).join('');
    return`<div class="num-cell"><div class="stage-val">
      <span class="stage-num${isd?' destiny':''}">${fmt}</span>
      <span class="stage-lv">${lv.level}</span>
    </div></div>`;
  }).join('');
  const stagesRow=`<div class="num-row" style="grid-template-columns:repeat(${ftCols},1fr);margin-bottom:24px">${ftStageCells}</div>`;
  const birthdayPassedForPhase=isGreg
    ?(todayM>birthM)||(todayM===birthM&&todayD>=birthD)
    :(()=>{const lt=solarToLunar(todayY,todayM,todayD);const ltm=lt?lt.month:todayM;const ltd=lt?lt.day:todayD;return(ltm>birthM)||(ltm===birthM&&ltd>=birthD);})();
  const phaseYear=birthdayPassedForPhase?todayY:todayY-1;
  const currentPhase=((phaseYear-birthY+1)%9+9)%9||9;
  const phaseNames=lang==='en'
    ?['Set<br>Your<br>Goal','Plan<br>and<br>Try','Clear<br>the<br>Old','Root<br>the<br>Value','Stay<br>or<br>Pivot','Mend<br>and<br>Heal','Let<br>Karma<br>Reveal','Review<br>and<br>Settle','Rest<br>and<br>Still']
    :['立定目標','佈局試探','清理舊習','格局抉擇','尋適守成','和解療癒','驗收因果','結算檢討','休息沈澱'];
  const phaseCells=Array.from({length:9},(_,i)=>{
    const isActive=(i+1)===currentPhase;
    const bg=isActive?'background:#fdf0c8;':'background:#fff;';
    const color=isActive?'color:#b8860b;font-weight:600;':'color:#bbb;';
    const nameColor=isActive?'color:#b8860b;font-weight:500;':'color:#ccc;';
    return`<div class="fyt-col">
      <div class="fyt-cell age-row" style="${bg}"><div class="fyt-age" style="${color}">${lang==='en'?`Phase ${i+1}`:`位格${i+1}`}</div></div>
      <div class="fyt-cell num-row" style="border-bottom:none;${bg}"><div class="fyt-age" style="${nameColor}white-space:normal;word-break:break-word;line-height:1.3;text-align:center;padding:2px 1px">${phaseNames[i]}</div></div>
    </div>`;
  }).join('');
  const phaseHeader=`<div class="fyt-group"><div class="fyt-grid">${phaseCells}</div></div>`;
  let html=`<div class="flow-year-table">${titleWithDate}${bdHeader}${stagesRow}<div class="flow-year-title">${t('flowTableSuffix')}</div>${legend}${phaseHeader}`;
  for(const group of groups){
    while(group.length<9) group.push(null);
    const colCells=group.map(r=>{
      if(!r) return`<div class="fyt-col"><div class="fyt-cell age-row"></div><div class="fyt-cell year-row"></div><div class="fyt-cell num-row"></div></div>`;
      const isCurrent=r.year===currentYear;
      const stateCls=isCurrent?' current':'';
      const g6cls=r.g6?' g6':'';
      const g5cls=r.g5?' g5':'';
      const g4cls=r.g4?' g4':'';
      const parts=r.stage.str.split('/');
      const fmt=parts.map((p,i)=>i===parts.length-1?`<span class="d">${p}</span>`:`${p}/`).join('');
      const wrapCls=isCurrent?' fyt-col-current':'';
      return`<div class="fyt-col${wrapCls}">
        <div class="fyt-cell age-row${g6cls}"><div class="fyt-age">${r.age}</div></div>
        <div class="fyt-cell year-row${stateCls}${g5cls}"><div class="fyt-year">${r.year}</div></div>
        <div class="fyt-cell num-row${stateCls}${g4cls}"><div class="fyt-num">${fmt}<span class="lv">${r.lv.level}</span></div></div>
      </div>`;
    }).join('');
    html+=`<div class="fyt-group"><div class="fyt-grid">${colCells}</div></div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

// 局部階段呈現：只有年→僅老年；有年月→老年+中年。主生日與第二組生日共用。
function renderStagePartialSection(el,sy,sm,hasMonthFlag){
  if(!hasMonthFlag){
    const yD=digs(sy);
    const elderStage=makeStage(sumArr(yD));
    const innate=p2(sy).length===4?String(sy).split('').map(Number):yD;
    const lv=calcLevel(innate,elderStage.destiny,elderStage.pathNums);
    el.innerHTML=`
    <div class="cal-title">${t('greg')}<span class="cal-sign">(+)</span></div>
    <div class="num-header" style="grid-template-columns:1fr;justify-content:center"><div class="num-cell label">${sy}</div></div>
    <div class="num-row" style="grid-template-columns:1fr;justify-content:center"><div class="num-cell"><div class="stage-val"><span class="stage-num">${elderStage.str.split('/').map((p,i,a)=>i===a.length-1?'<span class="stage-dest">'+p+'</span>':'<span class="stage-path">'+p+'/</span>').join('')}</span><span class="stage-lv">${lv.level}</span></div></div></div>`;
  } else {
    const yD=digs(sy),mD=p2(sm).split('').map(Number);
    const innate=[...String(sy).split('').map(Number),...mD];
    const elderStage=makeStage(sumArr(yD));
    const midStage=makeStage(sumArr([...yD,...mD]));
    const elvEl=calcLevel(innate,elderStage.destiny,elderStage.pathNums);
    const mlvEl=calcLevel(innate,midStage.destiny,midStage.pathNums);
    el.innerHTML=`
    <div class="cal-title">${t('greg')}<span class="cal-sign">(+)</span></div>
    <div class="num-header" style="grid-template-columns:repeat(2,minmax(60px,120px));justify-content:center"><div class="num-cell label">${sy}</div><div class="num-cell label">${p2(sm)}</div></div>
    <div class="num-row" style="grid-template-columns:repeat(2,minmax(60px,120px));justify-content:center">
      <div class="num-cell"><div class="stage-val"><span class="stage-num">${elderStage.str.split('/').map((p,i,a)=>i===a.length-1?'<span class="stage-dest">'+p+'</span>':'<span class="stage-path">'+p+'/</span>').join('')}</span><span class="stage-lv">${elvEl.level}</span></div></div>
      <div class="num-cell"><div class="stage-val"><span class="stage-num">${midStage.str.split('/').map((p,i,a)=>i===a.length-1?'<span class="stage-dest">'+p+'</span>':'<span class="stage-path">'+p+'/</span>').join('')}</span><span class="stage-lv">${mlvEl.level}</span></div></div>
    </div>`;
  }
}

  gregEl.innerHTML='';gregEl.classList.add('hidden');
  const lunEl=document.getElementById(targets.lunSectionId);

  const ngEl=document.getElementById(targets.nineGridId);
  ngEl.innerHTML='';ngEl.classList.add('hidden');

  document.getElementById(targets.panelLunId).classList.add('hidden');

}

// 回傳 {gregY,gregM,gregD,lunY,lunM,lunD,sup} 供合併流年表使用；ly/lm/ld 由呼叫端算好傳入
// （閏月的第二組農曆是用月份推算，不是重新換算，避免跟主生日對不起來）
function renderExtraSlotFull(targets,sy,sm,sd,ly,lm,ld,sh,smn,sup,dividerTextKey,isLeapMonth=false){
  document.getElementById(targets.dividerId).classList.remove('hidden');
  const dt=document.getElementById(targets.dividerTextId); if(dt) dt.textContent=t(dividerTextKey);
  if(dividerTextKey==='bd2Divider'){
    if(!_bd2FullTracked&&typeof gtag==='function') gtag('event','bd2_stages_shown');
    _bd2FullTracked=true;
  }
  const gregEl=document.getElementById(targets.gregSectionId);
  const lunEl=document.getElementById(targets.lunSectionId);
  const gInnate=String(sy).split('').concat(p2(sm).split(''),p2(sd).split('')).map(Number);
  const lInnate=String(ly).split('').concat(p2(lm).split(''),p2(ld).split('')).map(Number);
  renderCalSection(gregEl,true,`${sy}/${p2(sm)}/${p2(sd)}`,sy,sm,sd,sh,smn,gInnate,false);
  renderCalSection(lunEl,false,`${ly}/${isLeapMonth?t('leap'):''}${p2(lm)}/${p2(ld)}`,ly,lm,ld,sh,smn,lInnate,true,isLeapMonth);
  gregEl.classList.remove('hidden');lunEl.classList.remove('hidden');
  const gBreak=destinyBreakdown(sumArr([...String(sy).split('').map(Number),...p2(sm).split('').map(Number),...p2(sd).split('').map(Number)]));
  const lBreak=destinyBreakdown(sumArr([...String(ly).split('').map(Number),...p2(lm).split('').map(Number),...p2(ld).split('').map(Number)]));
  renderNineGrids(gInnate,lInnate,gBreak.pathNums,lBreak.pathNums,gBreak.destinyNums,lBreak.destinyNums,'','',targets.nineGridId);
  document.getElementById(targets.nineGridId).classList.remove('hidden');
  renderFlowYearTable(document.getElementById(targets.gregFlowTableId),sy,sm,sd,gInnate,true,false,sh,smn);
  renderFlowYearTable(document.getElementById(targets.lunFlowTableId),ly,lm,ld,lInnate,false,isLeapMonth,sh,smn);
  document.getElementById(targets.panelGregId).classList.remove('hidden');
  document.getElementById(targets.panelLunId).classList.remove('hidden');
  const tabsEl=document.querySelector('.tabs');
  if(!document.getElementById(targets.tabGregId)){
    const tg=document.createElement('div');
    tg.className='tab';tg.id=targets.tabGregId;setTabLabel(tg,t(targets.tabGregKey));
    tg.onclick=()=>switchTab(targets.tabGregIdx);
    tabsEl.appendChild(tg);
  }
  if(!document.getElementById(targets.tabLunId)){
    const tl=document.createElement('div');

function renderPartial(){_resetFlowNav();
  const syRaw=document.getElementById('inputYear').value.trim();
  const smRaw=document.getElementById('inputMonth').value.trim();
  const sdRaw=document.getElementById('inputDay').value.trim();
  const shRaw=document.getElementById('inputHour').value.trim();
  const smnRaw=document.getElementById('inputMin').value.trim();
  const sy=parseInt(syRaw)||0;
  const sm=parseInt(smRaw)||0;
  const sd=parseInt(sdRaw)||0;
  const errEl=document.getElementById('errorMsg');
  const main=document.getElementById('mainResult');
  errEl.classList.add('hidden');

  const hasYear=syRaw.length===4&&sy>0;
  const hasMonth=smRaw.length>0&&sm>=1&&sm<=12;
  const hasDay=sdRaw.length>0&&sd>=1&&sd<=31;

  // 驗證紅框
  document.getElementById('inputMonth').classList.toggle('invalid', smRaw.length>0&&!hasMonth);
  document.getElementById('inputDay').classList.toggle('invalid', sdRaw.length>0&&!hasDay);
  const shv=shRaw;
  const smnv=smnRaw;
  document.getElementById('inputHour').classList.toggle('invalid', shRaw.length>0&&(parseInt(shRaw)<0||parseInt(shRaw)>23||isNaN(parseInt(shRaw))));

  if(!hasYear){main.classList.add('hidden');return;}
  const sh=shRaw.length>0&&parseInt(shRaw)>=0&&parseInt(shRaw)<=23?parseInt(shRaw):null;
  const smn=smnRaw.length>0&&parseInt(smnRaw)>=0&&parseInt(smnRaw)<=59?parseInt(smnRaw):null;

  // 手動第二組生日（報錯戶口等情況），需完整年月日才算數
  const y2Raw=document.getElementById('inputYear2').value.trim();
  const m2Raw=document.getElementById('inputMonth2').value.trim();
  const d2Raw=document.getElementById('inputDay2').value.trim();
  const h2Raw=document.getElementById('inputHour2').value.trim();
  const mn2Raw=document.getElementById('inputMin2').value.trim();
  const sy2raw=parseInt(y2Raw)||0, sm2raw=parseInt(m2Raw)||0, sd2raw=parseInt(d2Raw)||0;
  const hasBd2Year=y2Raw.length===4&&sy2raw>0;
  const hasBd2Month=m2Raw.length>0&&sm2raw>=1&&sm2raw<=12;
  const hasBd2Day=d2Raw.length>0&&sd2raw>=1&&sd2raw<=31;
  const hasBd2Full=hasBd2Year&&hasBd2Month&&hasBd2Day;
  if(!hasBd2Full) _bd2FullTracked=false;
  const sh2=h2Raw.length>0&&parseInt(h2Raw)>=0&&parseInt(h2Raw)<=23?parseInt(h2Raw):null;
  const smn2=mn2Raw.length>0&&parseInt(mn2Raw)>=0&&parseInt(mn2Raw)<=59?parseInt(mn2Raw):null;

  // 決定要顯示幾欄
  // 只有年：老年
  // 年月：老年、中年
  // 年月日：全部
  const gregSection=document.getElementById('gregSection');
  const lunSection=document.getElementById('lunSection');

  if(hasYear&&!hasMonth){
    // 只顯示老年數（陽曆）
    renderStagePartialSection(gregSection,sy,sm,false);
    lunSection.innerHTML='';
    document.getElementById('innateSection').style.display='none';
    document.getElementById('flowBlock').style.display='none';
    main.classList.remove('hidden');
    initScreenshotBtn();
    return;
  }

  if(hasYear&&hasMonth&&!hasDay){
    // 顯示老年、中年（陽曆）
    renderStagePartialSection(gregSection,sy,sm,true);
    lunSection.innerHTML='';
    document.getElementById('innateSection').style.display='none';
    document.getElementById('flowBlock').style.display='none';
    main.classList.remove('hidden');
    initScreenshotBtn();
    return;
  }

  if(hasYear&&hasMonth&&hasDay){
    document.getElementById('innateSection').style.display='';
    document.getElementById('flowBlock').style.display='';
    // 完整計算
    const lunar=solarToLunar(sy,sm,sd);
    if(!lunar){main.classList.add('hidden');return;}
    const{year:ly,month:lm,day:ld,isLeap}=lunar;
    const gInnate=String(sy).split('').concat(p2(sm).split(''),p2(sd).split('')).map(Number);
    const lInnate=String(ly).split('').concat(p2(lm).split(''),p2(ld).split('')).map(Number);
    renderCalSection(gregSection,true,`${sy}/${p2(sm)}/${p2(sd)}`,sy,sm,sd,sh,smn,gInnate);
    renderCalSection(lunSection,false,`${ly}/${isLeap?t('leap'):''}${p2(lm)}/${p2(ld)}`,ly,lm,ld,sh,smn,lInnate,true,isLeap);
    // 青年數（主命數）的所有數字，保留重複
    const gDestinyTotal=sumArr([...String(sy).split('').map(Number),...p2(sm).split('').map(Number),...p2(sd).split('').map(Number)]);
    const lDestinyTotal=sumArr([...String(ly).split('').map(Number),...p2(lm).split('').map(Number),...p2(ld).split('').map(Number)]);
    const gBreak=destinyBreakdown(gDestinyTotal);
    const lBreak=destinyBreakdown(lDestinyTotal);
    const gDestinyStr=makeStage(gDestinyTotal).str;
    const lDestinyStr=makeStage(lDestinyTotal).str;
    renderNineGrids(gInnate,lInnate,gBreak.pathNums,lBreak.pathNums,gBreak.destinyNums,lBreak.destinyNums,gDestinyStr,lDestinyStr);
    document.getElementById('innateTitleText').textContent=t('innateTitle');
    const phaseTitleEl2=document.getElementById('phaseTitleText');
    if(phaseTitleEl2) phaseTitleEl2.textContent=t('phaseTitle');
    const phaseNavPrevEl2=document.getElementById('phaseNavPrevText');
    if(phaseNavPrevEl2) phaseNavPrevEl2.textContent=t('phaseNavPrev');
    const phaseNavNextEl2=document.getElementById('phaseNavNextText');
    if(phaseNavNextEl2) phaseNavNextEl2.textContent=t('phaseNavNext');
    const now=new Date();
    // 流年流月流日
    const nowY=now.getFullYear(),nowM=now.getMonth()+1,nowD=now.getDate();
    const flowSets1=[{gregY:sy,gregM:sm,gregD:sd,lunY:ly,lunM:lm,lunD:ld,sup:'¹'}];
    renderFlowYearTable(document.getElementById('gregFlowTable'),sy,sm,sd,gInnate,true,false,sh,smn);
    renderFlowYearTable(document.getElementById('lunFlowTable'),ly,lm,ld,lInnate,false,isLeap,sh,smn);

    // 第二組／第三組：閏月自動觸發＝一定佔 slot2；手動第二組生日，若閏月已佔用 slot2 則落在 slot3，否則也用 slot2
    let flowSetsAll=[...flowSets1];
    // 靈魂本質要跑的生日組別（陽曆 by/bm/bd + 時分），只收「完整年月日」的組，跟 flowSetsAll 的 slot 分派邏輯保持同步
    let soulSets=[{by:sy,bm:sm,bd:sd,bh:sh,bmn:smn,dividerKey:null}];
    if(isLeap){
      _secondSetReason='leap';
      const solar2=lunarToSolar(ly,lm,ld);
      if(solar2){
        const sy2=solar2.year,sm2=solar2.month,sd2=solar2.day;
        const lm2=lm===12?1:lm+1;
        const ly2=lm===12?ly+1:ly;
        const entry=renderExtraSlotFull(SLOT2_TARGETS,sy2,sm2,sd2,ly2,lm2,ld,sh,smn,'²','leapDivider');
        if(entry){ flowSetsAll.push(entry); soulSets.push({by:sy2,bm:sm2,bd:sd2,bh:sh,bmn:smn,dividerKey:'leapDivider'}); }
      } else {
        clearExtraSlot(SLOT2_TARGETS);
      }
      // 閏月已佔用 slot2，手動第二組生日（若有）落在 slot3
      if(hasBd2Full){
        const sy3=parseInt(y2Raw),sm3=parseInt(m2Raw),sd3=parseInt(d2Raw);
        const lunar3=solarToLunar(sy3,sm3,sd3);
        if(lunar3){
          const entry=renderExtraSlotFull(SLOT3_TARGETS,sy3,sm3,sd3,lunar3.year,lunar3.month,lunar3.day,sh2,smn2,'³','bd2Divider',lunar3.isLeap);
          if(entry){ flowSetsAll.push(entry); soulSets.push({by:sy3,bm:sm3,bd:sd3,bh:sh2,bmn:smn2,dividerKey:'bd2Divider'}); }
        } else {
          clearExtraSlot(SLOT3_TARGETS);
        }
      } else if(hasBd2Year){
        renderExtraSlotPartial(SLOT3_TARGETS,sy2raw,sm2raw,hasBd2Month,'bd2Divider');
      } else {
        clearExtraSlot(SLOT3_TARGETS);
      }
    } else if(hasBd2Full){
      _secondSetReason='bd2';
      const sy2=parseInt(y2Raw),sm2=parseInt(m2Raw),sd2=parseInt(d2Raw);
      const lunar2=solarToLunar(sy2,sm2,sd2);
      if(lunar2){
        const entry=renderExtraSlotFull(SLOT2_TARGETS,sy2,sm2,sd2,lunar2.year,lunar2.month,lunar2.day,sh2,smn2,'²','bd2Divider',lunar2.isLeap);
        if(entry){ flowSetsAll.push(entry); soulSets.push({by:sy2,bm:sm2,bd:sd2,bh:sh2,bmn:smn2,dividerKey:'bd2Divider'}); }
      } else {
        clearExtraSlot(SLOT2_TARGETS);
      }
      clearExtraSlot(SLOT3_TARGETS);
    } else if(hasBd2Year){
      // 第二組生日只填了年，或年+月：比照主生日的局部呈現（僅老年，或老年+中年）——靈魂本質資料不足，不列入 soulSets
      _secondSetReason='bd2';
      renderExtraSlotPartial(SLOT2_TARGETS,sy2raw,sm2raw,hasBd2Month,'bd2Divider');
      clearExtraSlot(SLOT3_TARGETS);
    } else {
      _secondSetReason=null;
      clearExtraSlot(SLOT2_TARGETS);
      clearExtraSlot(SLOT3_TARGETS);
    }
    _soulSets=soulSets;
    // tab1/tab2（陽曆／陰曆流年表）是否標註上標數字，取決於合併流年表是否有多組
    if(flowSetsAll.length>1){
      setTabLabel(document.getElementById('tab1'),t('tab1'));
      setTabLabel(document.getElementById('tab2'),t('tab2'));
    } else {
      setTabLabel(document.getElementById('tab1'),t('tab1no'));
      setTabLabel(document.getElementById('tab2'),t('tab2no'));
    }
    _phaseNavOffset=0;
    renderPhase(document.getElementById('phaseBlock'),flowSetsAll,nowY,nowM,nowD);
    renderFlowYear(document.getElementById('flowYearBlock'),flowSetsAll,nowY,nowM,nowD);
    _initFlowNav(flowSetsAll,nowY,nowM);
    renderFlowMonth(document.getElementById('flowMonthBlock'),flowSetsAll,nowY,nowM,nowD);
    renderFlowDay(document.getElementById('flowDayBlock'),flowSetsAll,nowY,nowM,nowD);
    main.classList.remove('hidden');
    initScreenshotBtn();
    renderSoulSection();
  }
}

function bindDateInputNav(ids){
  ids.forEach(function(id){
    const el=document.getElementById(id);
    el.addEventListener('input',function(){
      this.value=this.value.replace(/[^0-9]/g,'');
      // 自動跳下一格
      const maxLen=parseInt(this.getAttribute('maxlength'));
      if(this.value.length>=maxLen){
        const next=ids[ids.indexOf(id)+1];
        if(next) document.getElementById(next).focus();
      }
      if(_pairSel.length){_pairSel=[];renderRecordList();} // 輸入新生日時清空合盤勾選
      renderPartial();
    });
    el.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&this.value===''){
        const prev=ids[ids.indexOf(id)-1];
        if(prev){
          e.preventDefault();
          const prevEl=document.getElementById(prev);
          prevEl.focus();
          // 移到末位
          const len=prevEl.value.length;
          prevEl.setSelectionRange(len,len);
        }
      }
    });
  });
}

const RECORDS_KEY='rainbowRecords';

function getRecords(){
  try{return JSON.parse(localStorage.getItem(RECORDS_KEY))||[];}
  catch{return [];}
}
function saveRecordsList(list){
  localStorage.setItem(RECORDS_KEY,JSON.stringify(list));
}

function exportRecords(){
  const list=getRecords();
  const blob=new Blob([JSON.stringify(list,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  const today=new Date();
  const ymd=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  link.download=`彩虹數字_紀錄_${ymd}.json`;
  link.href=url;
  link.click();
  URL.revokeObjectURL(url);
  if(typeof gtag==='function') gtag('event','records_exported');
}

function importRecordsFile(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('not array');
      const existing=getRecords();
      const existingIds=new Set(existing.map(r=>r.id));
      let addedCount=0;
      imported.forEach(r=>{
        if(r&&typeof r==='object'&&r.year&&r.month&&r.day&&!existingIds.has(r.id)){
          existing.push(r);
          existingIds.add(r.id);
          addedCount++;
        }
      });
      saveRecordsList(existing);
      renderRecordList();
      if(addedCount>0){
        setRecMsg(t('recImportSuccess').replace('{n}',addedCount),'ok');
        if(typeof gtag==='function') gtag('event','records_imported');
      } else {
        setRecMsg(t('recImportNone'),'err');
      }
    }catch(err){
      setRecMsg(t('recImportError'),'err');
    }
    event.target.value='';
  };
  reader.readAsText(file);
}

  const{stages}=calcStages(y,m,d,h,mn);
  const order=['老年','中年','青年','少年','幼年'];
  return order.map(name=>{
    const s=stages.find(x=>x.name===name);
    if(!s) return'';
    return`<span class="rec-stage-cell${s.isDestiny?' dest':''}">${s.str}</span>`;
  }).join('');
}
function buildCalBlock(sign,y,m,d,h,mn,isLeapMonth){
  const timeStr=(h!==null)?` ${p2(h)}:${mn!==null?p2(mn):'--'}`:'';
  const dateLine=`${sign}${y}/${p2(m)}/${p2(d)}${isLeapMonth?t('leap'):''}${timeStr}`;
  const stageLine=buildMiniStageRow(y,m,d,h,mn);
  return`<div class="rec-cal-block"><div class="rec-item-date">${dateLine}</div><div class="rec-stage-row">${stageLine}</div></div>`;
}
function recordCard(r){
  const gregBlock=buildCalBlock('+',r.year,r.month,r.day,r.hour,r.minute,false);
  const lunar=solarToLunar(r.year,r.month,r.day);
  const lunBlock=lunar?buildCalBlock('-',lunar.year,lunar.month,lunar.day,r.hour,r.minute,lunar.isLeap):'';
  let bd2Block='';
  if(r.year2){
    const gregBlock2=buildCalBlock('+',r.year2,r.month2,r.day2,r.hour2,r.minute2,false);
    const lunar2=solarToLunar(r.year2,r.month2,r.day2);
    const lunBlock2=lunar2?buildCalBlock('-',lunar2.year,lunar2.month,lunar2.day,r.hour2,r.minute2,lunar2.isLeap):'';
    bd2Block=`<div class="rec-bd2-divider">${t('bd2Divider')}</div>`+gregBlock2+lunBlock2;
  }
  return gregBlock+lunBlock+bd2Block;
}
